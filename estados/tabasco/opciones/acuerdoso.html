<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACUERDOS</title>
    <link rel="icon" type="image/png" href="../../../imagenes/migracion.png">
    <link rel="stylesheet" href="../../diseños/diseñounafoto.css">
    <script src="../../../js/auth.js" defer></script>
    <script src="../../../js/load-menu.js" defer></script>
    <style>
        /* Estilos específicos para móviles iOS */
        @media only screen and (max-width: 768px) {
            .ios-only {
                display: none; /* Oculto por defecto */
            }
            
            /* Solo mostrar en iOS */
            @supports (-webkit-touch-callout: none) {
                .ios-only {
                    display: block;
                    text-align: center;
                    margin: 20px;
                    padding: 15px;
                    background: #f8f8f8;
                    border-radius: 10px;
                    border: 1px solid #ddd;
                }
                
                .ios-pdf-link {
                    display: inline-flex;
                    align-items: center;
                    gap: 10px;
                    background: #691932;
                    color: white;
                    padding: 12px 20px;
                    border-radius: 8px;
                    text-decoration: none;
                    margin-top: 15px;
                }
                
                .ios-pdf-link img {
                    width: 30px;
                    height: 30px;
                }
                
                .ios-instructions {
                    font-size: 14px;
                    color: #666;
                    margin-top: 10px;
                }
            }
        }
        
        /* Estilo para el título principal */
        .titulo-personalizado {
            color: #2c3e50;
            text-align: center;
            margin: 20px 0;
            font-size: 24px;
            padding: 0 15px;
        }
        
        /* Estilo para la información del archivo */
        .file-info {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border: 1px solid #ddd;
        }
        
        .file-info h3 {
            margin-top: 0;
            color: #2c3e50;
        }
        
        .download-btn {
            display: inline-block;
            background: #3498db;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            text-decoration: none;
            margin-top: 10px;
        }
        
        .download-btn:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <script src="../../../config.js"></script>
    <h1 id="titulo-documento">ACUERDOS</h1>        
    <div class="loading" id="loading">
        <div class="spinner"></div>
    </div>

    <div class="logo-container">
        <img src="../../../imagenes/inm logo.png" alt="Logo INM">
    </div>
    
    <div class="pdf-container">
        <iframe 
            id="pdf-viewer" 
            class="pdf-embed"
            frameborder="0"
            title="Visualizador de PDF"
        ></iframe>
        <div id="pdf-error" class="error-message" style="display: none;"></div>
    </div>

    <!-- Contenedor específico para iOS (oculto en otros dispositivos) -->
    <div id="ios-container" class="ios-only">
        <p>Para una mejor experiencia en tu dispositivo iOS:</p>
        <a href="#" id="ios-pdf-link" class="ios-pdf-link" target="_blank">
            <i class="fas fa-file-pdf"></i>
            <span>Abrir Documento</span>
        </a>
        <p class="ios-instructions">Toca el botón arriba para abrir el PDF en una nueva ventana</p>
    </div>

    <div class="mobile-images">
        <div id="mobile-error" class="error-message" style="display: none;"></div>
    </div>

    <button class="regresar-btn" onclick="window.location.href='../tabascoindex.html'">Regresar</button>

<script>
    // Configuración - ESTOS SON LOS PARÁMETROS QUE DEBES CAMBIAR
    const BACKEND_URL = window.CONFIG.BACKEND_URL;
    const API_TOKEN = window.CONFIG.getToken();
    const ESTADO = 'tabasco';       // Cambia por el estado que necesites
    const TIPO_DOCUMENTO = 'acuerdos_visita'; // Cambia por el tipo de documento que necesites
    const TITULO_DOCUMENTO = 'ACUERDOS'; // Cambia por el título que quieras mostrar

    // Configuración dinámica desde URL (opcional)
    const params = new URLSearchParams(window.location.search);
    const estadoFromURL = params.get('estado');
    const tipoFromURL = params.get('tipo');
    const tituloFromURL = params.get('titulo');

    // Valores finales (usa los de URL si existen, sino los definidos arriba)
    const ESTADO_FIJO = estadoFromURL || ESTADO;
    const TIPO_DOC_FIJO = tipoFromURL || TIPO_DOCUMENTO;
    const TITULO_FINAL = tituloFromURL || TITULO_DOCUMENTO;

    // Detectar iOS
    function isIOS() {
        return /iPad|iPhone|iPod/.test(navigator.userAgent) || 
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }

    // Mostrar/ocultar loading
    function showLoading(show) {
        document.getElementById('loading').style.display = show ? 'flex' : 'none';
    }

    // Mostrar mensaje de error
    function showError(message, target = 'both') {
        if (target === 'both' || target === 'pdf') {
            const pdfError = document.getElementById('pdf-error');
            pdfError.textContent = message;
            pdfError.style.display = 'block';
        }
        if (target === 'both' || target === 'mobile') {
            const mobileError = document.getElementById('mobile-error');
            mobileError.textContent = message;
            mobileError.style.display = 'block';
        }
    }

    // Ocultar errores
    function hideErrors() {
        document.getElementById('pdf-error').style.display = 'none';
        document.getElementById('mobile-error').style.display = 'none';
    }

    // Formatear fecha legible
    function formatDate(dateString) {
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        return new Date(dateString).toLocaleDateString('es-MX', options);
    }

    // Cargar PDF desde Cloudinary (función genérica)
    async function cargarDocumentoPDF() {
        showLoading(true);
        hideErrors();

        // Actualizar título de la página
        document.title = TITULO_FINAL + ' - ' + ESTADO_FIJO.toUpperCase();
        document.getElementById('titulo-documento').textContent = TITULO_FINAL;

        try {
            console.log(`Consultando API para: ${ESTADO_FIJO}/${TIPO_DOC_FIJO}`);
            const response = await fetch(`${BACKEND_URL}/archivos/${ESTADO_FIJO}/${TIPO_DOC_FIJO}`, {
                headers: { 'Authorization': 'Bearer ' + API_TOKEN }
            });

            if (!response.ok) throw new Error(`Error ${response.status}: ${response.statusText}`);

            const result = await response.json();
            console.log('Respuesta API:', result);

            if (!result?.data) throw new Error('Formato de respuesta inválido');

            const pdfViewer = document.getElementById('pdf-viewer');
            const mobileContainer = document.querySelector('.mobile-images');
            const iosLink = document.getElementById('ios-pdf-link');

            if (result.data.length > 0) {
                const latestPDF = result.data.sort((a, b) => 
                    new Date(b.uploaded_at) - new Date(a.uploaded_at)
                )[0];

                // Configuración normal para PC
                pdfViewer.src = latestPDF.url;
                
                // Configuración para móviles (no iOS)
                mobileContainer.innerHTML = `
                    <div class="file-info">
                        <h3>${latestPDF.filename || TITULO_FINAL}</h3>
                        <p>Actualizado: ${formatDate(latestPDF.uploaded_at)}</p>
                        <p>Tamaño: ${(latestPDF.size / (1024*1024)).toFixed(2)} MB</p>
                        <a href="${latestPDF.url}" class="download-btn" download="${latestPDF.filename || 'documento'}">
                            Descargar Documento
                        </a>
                    </div>
                `;
                
                // Configuración específica para iOS
                if (isIOS()) {
                    // Usamos Google Viewer como alternativa para iOS
                    const googleViewerUrl = `https://docs.google.com/viewer?url=${encodeURIComponent(latestPDF.url)}&embedded=true`;
                    iosLink.href = googleViewerUrl;
                    
                    // También agregamos opción de descarga directa
                    mobileContainer.innerHTML += `
                        <div class="ios-download-option">
                            <a href="${latestPDF.url}" class="download-btn" download="${latestPDF.filename || 'documento'}">
                                Descargar directamente
                            </a>
                        </div>
                    `;
                }
            } else {
                showError(`No se encontraron documentos de ${TITULO_FINAL.toLowerCase()} para ${ESTADO_FIJO}`, 'both');
            }
        } catch (error) {
            console.error('Error:', error);
            showError(`Error al cargar el documento: ${error.message}`, 'both');
        } finally {
            showLoading(false);
        }
    }

    // Inicialización
    document.addEventListener('DOMContentLoaded', () => {
        // Cargar el documento PDF
        if (document.getElementById('pdf-viewer')) {
            cargarDocumentoPDF();
        }

        // Cerrar submenús al hacer clic en opción
        document.querySelectorAll('.submenu-list a').forEach(link => {
            link.addEventListener('click', () => {
                document.querySelectorAll('.submenu').forEach(sub => {
                    sub.classList.remove('active');
                });
            });
        });
        
        // Manejar clic en el enlace de iOS
        document.getElementById('ios-pdf-link')?.addEventListener('click', function(e) {
            if (isIOS()) {
                // Abrir en nueva pestaña sin restricciones
                window.open(this.href, '_blank');
                e.preventDefault();
            }
        });
    });
</script>
</body>
</html>
