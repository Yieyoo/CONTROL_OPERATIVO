<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Organigrama</title>
    <link rel="icon" type="image/png" href="../../../imagenes/organigrama.png">
    <link rel="stylesheet" href="../../diseños/generaldoc.css">
    <style>
        /* El boton de alternar documento con top fijo (100px) tapaba el
           titulo en celular, donde el titulo empieza mas abajo. */
        @media (max-width: 768px) {
            #toggle-doc-btn { top: 152px !important; }
            .pdf-container { margin-top: 52px !important; }
        }
    </style>
    <script src="../../../js/auth.js" defer></script>   
    <script src="../../../js/load-menu.js" defer></script>
</head>
<body>
    <script src="../../../config.js"></script>
    <div class="header-lineas">
        <div class="linea-superior"></div>
        <div class="linea-inferior"></div>
    </div>
    <!-- EL MENÚ SE INSERTA AUTOMÁTICAMENTE AQUÍ POR load-menu.js -->

    <h1 id="titulo-documento" class="titulo-personalizado">Organigrama</h1>       
    <div class="loading" id="loading">
        <div class="spinner"></div>
    </div>
    <div class="logo-container">
        <img src="../../../imagenes/inm logo.png" alt="Logo INM">
    </div>
    
    <div class="pdf-container">
        <iframe 
            id="pdf-viewer" 
            class="pdf-embed"
            frameborder="0"
            title="Visualizador de PDF"
        ></iframe>
        <div id="pdf-error" class="error-message" style="display: none;"></div>
    </div>

    <!-- Contenedor específico para iOS (oculto en otros dispositivos) -->
    <div id="ios-container" class="ios-only">
        <p>Para visualizar el documento en tu dispositivo iOS:</p>
        <a href="#" id="ios-pdf-link" class="ios-pdf-link" download>
            <span>Descargar Documento</span>
        </a>
        <p class="ios-instructions">Toca el botón arriba para descargar el PDF a tu dispositivo</p>
    </div>

    <div class="mobile-images">
        <div id="mobile-error" class="error-message" style="display: none;"></div>
    </div>

    <!-- AGREGAR ESTOS ELEMENTOS QUE FALTAN -->
    <div id="fecha-subida" style="position: fixed; bottom: 10px; right: 10px; background-color: rgba(0,0,0,0.7); color: white; padding: 5px 10px; border-radius: 5px; font-size: 12px; z-index: 1000;">
        Actualizado: <span id="fecha-texto">Cargando...</span>
    </div>

    <!-- BOTÓN PARA ALTERNAR DOCUMENTOS -->
    <button id="toggle-doc-btn" style="position: fixed; top: 100px; right: 20px; background-color: #2c3e50; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">
        Mostrar Documento Alternativo
    </button>

    <button class="regresar-btn" onclick="window.location.href = '../pueblaindex.html'">Regresar</button>

    <script>
        // Configuración - ESTOS SON LOS PARÁMETROS QUE DEBES CAMBIAR
        const BACKEND_URL = window.CONFIG.BACKEND_URL;
        const API_KEY = window.CONFIG.API_KEY;
        const ESTADO = 'puebla';
        const TIPO_DOCUMENTO = 'organigrama';
        const TITULO_DOCUMENTO = 'Organigrama';
        
        // AÑADIR DOCUMENTO ALTERNATIVO
        const TIPO_DOCUMENTO_ALTERNATIVO = 'organigrama_or'; // Cambia este nombre según necesites

        // Configuración dinámica desde URL (opcional)
        const params = new URLSearchParams(window.location.search);
        const estadoFromURL = params.get('estado');
        const tipoFromURL = params.get('tipo');
        const tituloFromURL = params.get('titulo');

        // Valores finales (usa los de URL si existen, sino los definidos arriba)
        const ESTADO_FIJO = estadoFromURL || ESTADO;
        const TIPO_DOC_FIJO = tipoFromURL || TIPO_DOCUMENTO;
        const TITULO_FINAL = tituloFromURL || TITULO_DOCUMENTO;

        // Variables para alternar documentos
        let documentoActual = 'principal';
        let documentoAlternativoDisponible = null;

        // Detectar iOS
        function isIOS() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                   (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        }

        // Mostrar/ocultar loading
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }

        // Mostrar mensaje de error - VERSIÓN SEGURA
        function showError(message, target = 'both') {
            const pdfError = document.getElementById('pdf-error');
            const mobileError = document.getElementById('mobile-error');
            
            if ((target === 'both' || target === 'pdf') && pdfError) {
                pdfError.textContent = message;
                pdfError.style.display = 'block';
            }
            if ((target === 'both' || target === 'mobile') && mobileError) {
                mobileError.textContent = message;
                mobileError.style.display = 'block';
            }
        }

        // Ocultar errores - VERSIÓN SEGURA
        function hideErrors() {
            const pdfError = document.getElementById('pdf-error');
            const mobileError = document.getElementById('mobile-error');
            
            if (pdfError) pdfError.style.display = 'none';
            if (mobileError) mobileError.style.display = 'none';
        }

        // Formatear fecha legible
        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('es-MX', options);
        }

        // Verificar si existe documento alternativo
        async function verificarDocumentoAlternativo() {
            try {
                const response = await fetch(`${BACKEND_URL}/archivos/${ESTADO_FIJO}/${TIPO_DOCUMENTO_ALTERNATIVO}`, {
                    headers: { 'x-api-key': API_KEY }
                });

                if (response.ok) {
                    const result = await response.json();
                    if (result?.data && result.data.length > 0) {
                        const documentos = result.data.sort((a, b) => 
                            new Date(b.uploaded_at) - new Date(a.uploaded_at)
                        );
                        documentoAlternativoDisponible = documentos[0];
                        
                        const toggleBtn = document.getElementById('toggle-doc-btn');
                        toggleBtn.disabled = false;
                        toggleBtn.textContent = 'Mostrar Versión Completa';
                        return true;
                    }
                }
            } catch (error) {
                console.log('No se encontró documento alternativo');
            }
            
            // Si no hay documento alternativo, deshabilitar botón
            const toggleBtn = document.getElementById('toggle-doc-btn');
            toggleBtn.disabled = true;
            toggleBtn.textContent = 'Versión Completa No Disponible';
            return false;
        }

        // Función para alternar documentos
        async function alternarDocumento() {
            showLoading(true);
            hideErrors(); // ¡AHORA ESTA FUNCIÓN ES SEGURA!
            
            const toggleBtn = document.getElementById('toggle-doc-btn');
            
            try {
                if (documentoActual === 'principal') {
                    // Intentar cargar documento alternativo
                    if (documentoAlternativoDisponible) {
                        cargarDocumento(documentoAlternativoDisponible, 'alternativo');
                        
                        // Configurar descarga iOS
                        const iosLink = document.getElementById('ios-pdf-link');
                        if (isIOS() && iosLink) {
                            iosLink.href = documentoAlternativoDisponible.url;
                            iosLink.setAttribute('download', documentoAlternativoDisponible.filename || 'organigrama_completo.pdf');
                        }
                        
                        // Actualizar botón y estado
                        toggleBtn.textContent = 'Organigrama';
                        documentoActual = 'alternativo';
                        document.getElementById('titulo-documento').textContent = 'Organigrama Or';
                    } else {
                        alert('La versión completa no está disponible.');
                    }
                } else {
                    // Volver al documento principal (recargarlo)
                    await cargarDocumentoPDF();
                    documentoActual = 'principal';
                    toggleBtn.textContent = 'Organigrama Or';
                }
            } catch (error) {
                console.error('Error al alternar documento:', error);
                alert(`Error: ${error.message}`);
            } finally {
                showLoading(false);
            }
        }

        // Función para cargar un documento específico
        function cargarDocumento(documento, tipo) {
            const pdfViewer = document.getElementById('pdf-viewer');
            const fechaElement = document.getElementById('fecha-texto');
            
            if (!pdfViewer || !fechaElement) return;
            
            // Actualizar fecha
            fechaElement.textContent = formatDate(documento.uploaded_at);
            
            // Actualizar título
            const titulo = tipo === 'principal' ? 'Organigrama' : 'Organigrama Or';
            document.title = titulo + ' - ' + ESTADO_FIJO.toUpperCase();
            document.getElementById('titulo-documento').textContent = titulo;
            
            // Cargar PDF
            pdfViewer.src = documento.url;
            
            // Configurar para móviles (no iOS)
            const mobileContainer = document.querySelector('.mobile-images');
            if (!isIOS() && mobileContainer) {
                const tipoTexto = tipo === 'principal' ? 'Versión Básica' : 'Versión Completa';
                mobileContainer.innerHTML = `
                    <div class="file-info">
                        <h3>${documento.filename || titulo}</h3>
                        <p>Actualizado: ${formatDate(documento.uploaded_at)}</p>
                        <p>Tamaño: ${(documento.size / (1024*1024)).toFixed(2)} MB</p>
                        <p><em>${tipoTexto}</em></p>
                        <a href="${documento.url}" class="download-btn" download>
                            Descargar Documento
                        </a>
                    </div>
                `;
            }
        }

        // Cargar PDF desde Cloudinary
        async function cargarDocumentoPDF() {
            showLoading(true);
            hideErrors();

            try {
                console.log(`Consultando API para: ${ESTADO_FIJO}/${TIPO_DOC_FIJO}`);
                const response = await fetch(`${BACKEND_URL}/archivos/${ESTADO_FIJO}/${TIPO_DOC_FIJO}`, {
                    headers: { 'x-api-key': API_KEY }
                });

                if (!response.ok) throw new Error(`Error ${response.status}: ${response.statusText}`);

                const result = await response.json();
                console.log('Respuesta API:', result);

                if (!result?.data) throw new Error('Formato de respuesta inválido');

                const pdfViewer = document.getElementById('pdf-viewer');
                const iosLink = document.getElementById('ios-pdf-link');

                if (result.data.length > 0) {
                    const latestPDF = result.data.sort((a, b) => 
                        new Date(b.uploaded_at) - new Date(a.uploaded_at)
                    )[0];

                    // Cargar documento principal
                    cargarDocumento(latestPDF, 'principal');
                    
                    // Configuración específica para iOS
                    if (isIOS() && iosLink) {
                        iosLink.href = latestPDF.url;
                        iosLink.setAttribute('download', latestPDF.filename || 'organigrama.pdf');
                    }
                    
                    // Verificar si hay documento alternativo
                    await verificarDocumentoAlternativo();
                    
                } else {
                    showError(`No se encontraron documentos para ${ESTADO_FIJO}`, 'both');
                }
            } catch (error) {
                console.error('Error:', error);
                showError(`Error al cargar el documento: ${error.message}`, 'both');
            } finally {
                showLoading(false);
            }
        }

        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            // Configurar evento para el botón de alternar
            const toggleBtn = document.getElementById('toggle-doc-btn');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', alternarDocumento);
            }
            
            // Cargar el documento PDF
            if (document.getElementById('pdf-viewer')) {
                cargarDocumentoPDF();
            }
        });
    </script>
</body>
</html>
