<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Nuevo León - Control Operativo</title>
    <link rel="icon" type="image/png" sizes="48x48" href="../../imagenes/iconom.png">
    <link rel="stylesheet" href="../../estados/diseños/diseñogeneral.css">
    <script src="../../js/auth.js" defer></script>
    <script src="../../js/load-menu.js" defer></script>
</head>
<body>
    <!-- EL MENÚ SE INSERTA AUTOMÁTICAMENTE AQUÍ -->

    <header>
        <!-- EL BOTÓN DEL MENÚ SE INSERTA AUTOMÁTICAMENTE -->
        <!-- SOLO MANTENEMOS EL LOGO EN EL HEADER -->
        <div class="logo-container">
            <img src="../../imagenes/unnamed.png" alt="Gobernación" class="logo">
        </div>
    </header>

    <!-- Información del instituto -->
    <section class="instituto-info">
        <h1>INSTITUTO NACIONAL DE MIGRACIÓN</h1>
        <h2>Dirección General de Coordinación de Oficinas de Representación</h2>
        <h3>Dirección de Control Operativo</h3>
        <div class="fecha-actual" id="fechaActual"></div>
        <button class="regresar-btn" onclick="window.location.href='../../index.html'">
            <i class="fas fa-arrow-left"></i> Regresar
        </button>
    </section>

    <!-- Agregamos el nombre del estado aquí -->
    <div class="estado-info">
        <h4>Nuevo León</h4>
    </div>

    <!-- Contenedor solo para las opciones -->
    <div class="contenedor-principal">
        <div class="opciones-container">
            <div class="opciones-grid">
                <div class="fila">
                    <button class="btn-1" onclick="location.href='opciones/fichao.html'">
                        <i class="fas fa-id-card"></i> Ficha Curricular
                    </button>
                </div>
                <div class="fila">
                    <button class="btn-69" onclick="location.href='opciones/ubicaciones.html'">
                        <i class="fas fa-map-marked-alt"></i> Ubicación de las Oficinas del INM
                    </button>
                </div>
                <div class="fila">
                    <button class="btn-2" onclick="location.href='opciones/organigramao.html'">
                        <i class="fas fa-sitemap"></i> Organigrama
                    </button>
                    <button class="btn-3" onclick="location.href='opciones/plantillao.html'">
                        <i class="fas fa-users"></i> Plantilla de Personal
                    </button>
                </div>
                <div class="fila">
                    <button class="btn-4" onclick="location.href='../../construccion.html'">
                        <i class="fas fa-eye"></i> Última Visita de Supervisión y Evaluación
                    </button>
                    <button class="btn-5" onclick="location.href='../../construccion.html'">
                        <i class="fas fa-file-signature"></i> Acuerdos de Visita de Supervisión y Evaluación
                    </button>
                </div>
                <div class="fila">
                    <button class="btn-6" onclick="location.href='opciones/vehiculoso.html'">
                        <i class="fas fa-car"></i> Vehículos
                    </button>
                    <button class="btn-7" onclick="location.href='../../construccion.html'">
                        <i class="fas fa-building"></i> Inmuebles
                    </button>
                    <button class="btn-8" onclick="location.href='opciones/perroso.html'">
                        <i class="fas fa-dog"></i> Unidad Canina
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Contenedor de logos -->
    <div class="logo-container">
        <img src="../../imagenes/inm logo.png" alt="Logo INM">
    </div>

    <script>
        // Mostrar la fecha actual
        document.getElementById("fechaActual").innerHTML = new Date().toLocaleDateString('es-MX', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });

        // Efectos visuales adicionales - MANTENIENDO LA ANIMACIÓN QUE TE GUSTA
        document.addEventListener('DOMContentLoaded', function() {
            // Animación de entrada para los botones
            const buttons = document.querySelectorAll('.opciones-grid button');
            buttons.forEach((button, index) => {
                setTimeout(() => {
                    button.style.opacity = '1';
                    button.style.transform = 'translateY(0)';
                }, 100 * index);
            });
            
            // Efecto de carga de la página
            setTimeout(() => {
                document.body.classList.add('loaded');
            }, 100);
        });
    </script>

    <style>
        /* SOLO ESTILOS ESPECÍFICOS PARA AGUASCALIENTES - MÍNIMOS */
        
        /* Animación de los botones - MANTENER */
        .opciones-grid button {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
        }

        /* Color específico para Aguascalientes */
        .estado-info {
            background: linear-gradient(135deg, #a08d2d, #a08d2d);
        }

        /* Efecto de carga de la página */
        body {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        
        body.loaded {
            opacity: 1;
        }
    </style>
</body>
</html>
