<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PLANTILLA DE PERSONAL - ORS</title>
    <link rel="icon" type="image/png" href="../../../imagenes/pasaporte.png">
    <link rel="stylesheet" href="../../diseños/generaldoc.css">
    
    <!-- ✅ SCRIPTS ESENCIALES -->
    <script src="../../../auth.js" defer></script>
    <script src="../../../load-menu.js" defer></script>

</head>
<body>
    <div class="header-lineas">
        <div class="linea-superior"></div>
        <div class="linea-inferior"></div>
    </div>

    <!-- Contenedor para el título personalizado -->
    <div id="tituloContainer" class="titulo-personalizado">
        Cargando título...
    </div>

    <!-- 🔵 SELECTOR DE PLANTILLAS MEJORADO -->
    <div class="selector-container">
        <button id="btn-personal" class="selector-btn activo">PLANTILLA BASE</button>
        <button id="btn-eventual" class="selector-btn">PLANTILLA EVENTUAL</button>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
    </div>

    <div class="logo-container">
        <img src="../../../imagenes/inm logo.png" alt="Logo INM">
    </div>
    
    <div class="pdf-container">
        <iframe 
            id="pdf-viewer" 
            class="pdf-embed"
            frameborder="0"
            title="Visualizador de PDF"
        ></iframe>
        <!-- ✅ Elemento de error para PDF -->
        <div id="pdf-error" class="error-message" style="display: none;"></div>
    </div>

    <!-- Contenedor específico para iOS (oculto en otros dispositivos) -->
    <div id="ios-container" class="ios-only" style="display: none;">
        <p>Para visualizar el documento en tu dispositivo iOS:</p>
        <a href="#" id="ios-pdf-link" class="download-btn" download>
            <span>Descargar Documento</span>
        </a>
        <p class="ios-instructions">Toca el botón arriba para descargar el PDF a tu dispositivo</p>
    </div>

    <div class="mobile-images">
        <!-- ✅ Elemento de error para móvil -->
        <div id="mobile-error" class="error-message" style="display: none;"></div>
    </div>

    <div id="fecha-subida">
        Actualizado: <span id="fecha-texto">Cargando...</span>
    </div>

    <button class="regresar-btn" onclick="window.location.href = '../orsindex.html'">Regresar</button>

    <script>
        // CONFIGURACIÓN
        const BACKEND_URL = 'https://control-operativo-1.onrender.com/api';
        const API_KEY = 'Xhy2md57';
        const ESTADO_FIJO = 'ors'; // Cambiado a ORS como solicitaste

        // 🔵 Tipos de documento
        const TIPO_BASE = 'plantilla_personal';
        const TIPO_EVENTUAL = 'plantilla_eventual';
        
        // Tipo de documento actual
        let tipoDocumentoActual = TIPO_BASE;
        let documentoUrl = ''; // Para guardar la URL actual

        // Detectar iOS
        function isIOS() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                   (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        }

        // Función para obtener y cargar el título personalizado
        async function cargarTituloPersonalizado(tipo = TIPO_BASE) {
            const tituloContainer = document.getElementById('tituloContainer');

            try {
                const archivosResponse = await fetch(`${BACKEND_URL}/archivos/${ESTADO_FIJO}/${tipo}`, {
                    headers: { 'x-api-key': API_KEY }
                });

                if (archivosResponse.ok) {
                    const { data: archivos } = await archivosResponse.json();
                    if (archivos.length > 0) {
                        const ultimoArchivo = archivos.sort((a, b) => 
                            new Date(b.uploaded_at) - new Date(a.uploaded_at)
                        )[0];

                        if (ultimoArchivo.titulo_documento) {
                            // Actualizar título según el tipo
                            let titulo = ultimoArchivo.titulo_documento;
                            if (tipo === TIPO_EVENTUAL) {
                                titulo += ' - EVENTUAL';
                            }
                            tituloContainer.textContent = titulo;
                            document.title = titulo + ' - ORS';
                            return;
                        }
                    }
                }

                // Título por defecto según el tipo
                let tituloDefault = tipo === TIPO_BASE 
                    ? 'PLANTILLA BASE - ORS' 
                    : 'PLANTILLA EVENTUAL - ORS';
                
                tituloContainer.textContent = tituloDefault;
                document.title = tituloDefault;

            } catch (error) {
                console.error('Error cargando título:', error);
                let tituloError = tipo === TIPO_BASE 
                    ? 'PLANTILLA BASE - ORS' 
                    : 'PLANTILLA EVENTUAL - ORS';
                tituloContainer.textContent = tituloError;
                tituloContainer.style.color = 'red';
                document.title = tituloError;
            }
        }

        // Mostrar/ocultar loading
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }

        // Mostrar mensaje de error
        function showError(message, target = 'both') {
            console.error('Error:', message);
            
            if (target === 'both' || target === 'pdf') {
                const pdfError = document.getElementById('pdf-error');
                if (pdfError) {
                    pdfError.textContent = message;
                    pdfError.style.display = 'block';
                }
            }
            if (target === 'both' || target === 'mobile') {
                const mobileError = document.getElementById('mobile-error');
                if (mobileError) {
                    mobileError.textContent = message;
                    mobileError.style.display = 'block';
                }
            }
        }

        // Ocultar errores
        function hideErrors() {
            document.getElementById('pdf-error')?.style.display = 'none';
            document.getElementById('mobile-error')?.style.display = 'none';
        }

        // Formatear fecha
        function formatDate(dateString) {
            try {
                const options = { year: 'numeric', month: 'short', day: 'numeric' };
                return new Date(dateString).toLocaleDateString('es-MX', options);
            } catch (error) {
                return 'Fecha no disponible';
            }
        }

        // 🔵 Cargar Plantilla (según el tipo seleccionado)
        async function loadPlantilla() {
            showLoading(true);
            hideErrors();
            const fechaElement = document.getElementById('fecha-texto');
            const iosContainer = document.getElementById('ios-container');
            const iosLink = document.getElementById('ios-pdf-link');

            try {
                const response = await fetch(
                    `${BACKEND_URL}/archivos/${ESTADO_FIJO}/${tipoDocumentoActual}`,
                    { headers: { 'x-api-key': API_KEY } }
                );

                if (!response.ok) throw new Error(`Error ${response.status}: ${response.statusText}`);

                const result = await response.json();

                if (!result?.data) throw new Error('Formato de respuesta inválido');

                const pdfViewer = document.getElementById('pdf-viewer');
                const mobileContainer = document.querySelector('.mobile-images');

                if (result.data.length > 0) {
                    const latestPDF = result.data.sort((a, b) => 
                        new Date(b.uploaded_at) - new Date(a.uploaded_at)
                    )[0];

                    // Guardar URL para descarga
                    documentoUrl = latestPDF.url;

                    // Actualizar fecha
                    fechaElement.textContent = formatDate(latestPDF.uploaded_at);

                    // Configurar visor PDF
                    if (pdfViewer) {
                        pdfViewer.src = latestPDF.url;
                    }
                    
                    // Configuración para móviles (no iOS)
                    if (!isIOS() && mobileContainer) {
                        mobileContainer.innerHTML = `
                            <div class="file-info">
                                <h3>${latestPDF.filename || (tipoDocumentoActual === TIPO_BASE ? 'Plantilla Base' : 'Plantilla Eventual')}</h3>
                                <p>Actualizado: ${formatDate(latestPDF.uploaded_at)}</p>
                                <p>Tamaño: ${(latestPDF.size / (1024*1024)).toFixed(2)} MB</p>
                                <a href="${latestPDF.url}" class="download-btn" download>
                                    Descargar Documento
                                </a>
                            </div>
                        `;
                    }
                    
                    // Configuración para iOS
                    if (isIOS()) {
                        // Mostrar contenedor iOS
                        if (iosContainer) {
                            iosContainer.style.display = 'block';
                        }
                        
                        // Configurar enlace de descarga
                        if (iosLink) {
                            iosLink.href = latestPDF.url;
                            const nombreArchivo = tipoDocumentoActual === TIPO_BASE 
                                ? 'plantilla_base_ors.pdf' 
                                : 'plantilla_eventual_ors.pdf';
                            iosLink.setAttribute('download', latestPDF.filename || nombreArchivo);
                        }
                    } else if (iosContainer) {
                        iosContainer.style.display = 'none';
                    }
                    
                    // Actualizar título
                    await cargarTituloPersonalizado(tipoDocumentoActual);
                    
                } else {
                    let mensajeError = tipoDocumentoActual === TIPO_BASE 
                        ? 'No se encontraron documentos de plantilla base para ORS'
                        : 'No se encontraron documentos de plantilla eventual para ORS';
                    
                    showError(mensajeError, 'both');
                    fechaElement.textContent = 'No disponible';
                    
                    // Limpiar visor si no hay documentos
                    if (pdfViewer) pdfViewer.src = '';
                    if (iosContainer) iosContainer.style.display = 'none';
                }
            } catch (error) {
                console.error('Error al cargar plantilla:', error);
                showError(`Error al cargar la plantilla: ${error.message}`, 'both');
                fechaElement.textContent = 'Error al cargar';
                
                // Limpiar visor en caso de error
                const pdfViewer = document.getElementById('pdf-viewer');
                if (pdfViewer) pdfViewer.src = '';
                if (iosContainer) iosContainer.style.display = 'none';
            } finally {
                showLoading(false);
            }
        }

        // 🔵 Activar botón visualmente
        function activarBoton(id) {
            document.querySelectorAll(".selector-btn").forEach(btn => btn.classList.remove("activo"));
            document.getElementById(id).classList.add("activo");
        }

        // 🔵 Eventos para los botones
        document.getElementById("btn-personal").addEventListener("click", () => {
            tipoDocumentoActual = TIPO_BASE;
            activarBoton("btn-personal");
            loadPlantilla();
        });

        document.getElementById("btn-eventual").addEventListener("click", () => {
            tipoDocumentoActual = TIPO_EVENTUAL;
            activarBoton("btn-eventual");
            loadPlantilla();
        });

        // Manejar clic en enlace iOS
        document.addEventListener('DOMContentLoaded', () => {
            const iosLink = document.getElementById('ios-pdf-link');
            if (iosLink) {
                iosLink.addEventListener('click', function(e) {
                    if (isIOS() && documentoUrl) {
                        console.log('Abriendo PDF en iOS');
                        window.open(documentoUrl, '_blank');
                        e.preventDefault();
                    }
                });
            }
            
            // Inicializar
            loadPlantilla();
        });

        // Manejar errores globales
        window.addEventListener('error', (event) => {
            console.error('Error global:', event.error);
            showError('Error inesperado en la aplicación', 'both');
        });
    </script>
</body>
</html>
