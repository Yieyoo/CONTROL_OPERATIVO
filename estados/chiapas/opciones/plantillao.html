<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PLANTILLA DE PERSONAL - Chiapas</title>
    <link rel="icon" type="image/png" href="../../../imagenes/pasaporte.png">
    <link rel="stylesheet" href="../../diseños/generaldoc.css">
    
    <!-- ✅ SCRIPTS ESENCIALES -->
    <script src="../../../auth.js" defer></script>
    <script src="../../../load-menu.js" defer></script>
    
    <style>
        /* Estilo para la fecha de actualización */
        #fecha-subida {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background-color: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 1000;
        }

        /* 🔵 ESTILOS PARA LOS BOTONES DE PLANTILLAS */
        .selector-plantillas {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .btn-plantilla {
            padding: 12px 25px;
            background-color: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
            min-width: 180px;
        }

        .btn-plantilla:hover {
            background-color: #e0e0e0;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .btn-plantilla.activo {
            background-color: #2c5aa0;
            color: white;
            border-color: #1e3d6f;
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(44, 90, 160, 0.3);
        }

        /* Estilos para información del archivo */
        .file-info {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin: 10px auto;
            max-width: 500px;
            text-align: center;
        }

        .download-btn {
            display: inline-block;
            background: #691932;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            margin-top: 10px;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            #fecha-subida {
                font-size: 10px;
                padding: 3px 6px;
            }
            
            .selector-plantillas {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
            
            .btn-plantilla {
                width: 90%;
                max-width: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="header-lineas">
        <div class="linea-superior"></div>
        <div class="linea-inferior"></div>
    </div>
    <!-- EL MENÚ SE INSERTA AUTOMÁTICAMENTE AQUÍ POR load-menu.js -->

    <!-- Contenedor para el título personalizado -->
    <div id="tituloContainer" class="titulo-personalizado">
        Cargando título...
    </div>

    <!-- 🔵 BOTONES PARA SELECCIONAR TIPO DE PLANTILLA -->
    <div class="selector-plantillas">
        <button id="btn-plantilla-base" class="btn-plantilla activo">
            PLANTILLA BASE
        </button>
        <button id="btn-plantilla-eventual" class="btn-plantilla">
            PLANTILLA EVENTUAL
        </button>
    </div>
    
    <div class="loading" id="loading">
        <div class="spinner"></div>
    </div>

    <div class="logo-container">
        <img src="../../../imagenes/inm logo.png" alt="Logo INM">
    </div>
    
    <div class="pdf-container">
        <iframe 
            id="pdf-viewer" 
            class="pdf-embed"
            frameborder="0"
            title="Visualizador de PDF"
        ></iframe>
        <div id="pdf-error" class="error-message" style="display: none;"></div>
    </div>

    <div class="mobile-images">
        <div id="mobile-error" class="error-message" style="display: none;"></div>
    </div>

    <div id="fecha-subida">
        Actualizado: <span id="fecha-texto">Cargando...</span>
    </div>

    <button class="regresar-btn" onclick="window.location.href = '../chiapasindex.html'">Regresar</button>

    <script>
        // CONFIGURACIÓN
        const BACKEND_URL = 'https://control-operativo-1.onrender.com/api';
        const API_KEY = 'Xhy2md57';
        const ESTADO_FIJO = 'chiapas';
        
        // 🔵 DEFINIMOS LOS DOS TIPOS DE PLANTILLAS
        const TIPO_BASE = 'plantilla';
        const TIPO_EVENTUAL = 'plantilla_ne';
        
        // Variable para controlar qué plantilla está activa
        let tipoDocumentoActual = TIPO_BASE;

        // Detectar iOS
        function isIOS() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                   (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        }

        // Función para obtener y cargar el título personalizado DESDE CLOUDINARY
        async function cargarTituloPersonalizado(tipo = TIPO_BASE) {
            const tituloContainer = document.getElementById('tituloContainer');

            try {
                // 1. Intentar obtener el título desde el archivo más reciente de Cloudinary
                const archivosResponse = await fetch(`${BACKEND_URL}/archivos/${ESTADO_FIJO}/${tipo}`, {
                    headers: { 'x-api-key': API_KEY }
                });

                if (archivosResponse.ok) {
                    const { data: archivos } = await archivosResponse.json();
                    if (archivos.length > 0) {
                        const ultimoArchivo = archivos.sort((a, b) => 
                            new Date(b.uploaded_at) - new Date(a.uploaded_at)
                        )[0];

                        if (ultimoArchivo.titulo_documento) {
                            // Usar el título del documento desde Cloudinary
                            tituloContainer.textContent = ultimoArchivo.titulo_documento;
                            document.title = ultimoArchivo.titulo_documento + ' - Ciudad de México';
                            return;
                        }
                    }
                }

                // 2. Si no hay título en Cloudinary, intentar obtener desde endpoint global
                const tituloResponse = await fetch(`${BACKEND_URL}/obtener-titulo-global`, {
                    headers: { 'x-api-key': API_KEY }
                });

                if (tituloResponse.ok) {
                    const data = await tituloResponse.json();
                    if (data.titulo) {
                        tituloContainer.textContent = data.titulo;
                        document.title = data.titulo + ' - Ciudad de México';
                        return;
                    }
                }

                // 3. Título por defecto según el tipo
                let tituloDefault = tipo === TIPO_BASE 
                    ? 'PLANTILLA BASE - Ciudad de México' 
                    : 'PLANTILLA EVENTUAL - Ciudad de México';
                
                tituloContainer.textContent = tituloDefault;
                document.title = tituloDefault;

            } catch (error) {
                console.error('Error cargando título:', error);
                let tituloError = tipo === TIPO_BASE 
                    ? 'PLANTILLA BASE - Ciudad de México' 
                    : 'PLANTILLA EVENTUAL - Ciudad de México';
                tituloContainer.textContent = tituloError;
                tituloContainer.style.color = 'red';
                document.title = tituloError;
            }
        }

        // Mostrar/ocultar loading
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }

        // Mostrar mensaje de error
        function showError(message, target = 'both') {
            if (target === 'both' || target === 'pdf') {
                const pdfError = document.getElementById('pdf-error');
                pdfError.textContent = message;
                pdfError.style.display = 'block';
            }
            if (target === 'both' || target === 'mobile') {
                const mobileError = document.getElementById('mobile-error');
                mobileError.textContent = message;
                mobileError.style.display = 'block';
            }
        }

        // Ocultar errores
        function hideErrors() {
            document.getElementById('pdf-error').style.display = 'none';
            document.getElementById('mobile-error').style.display = 'none';
        }

        // Formatear fecha legible
        function formatDate(dateString) {
            try {
                const options = { year: 'numeric', month: 'short', day: 'numeric' };
                return new Date(dateString).toLocaleDateString('es-MX', options);
            } catch (error) {
                return 'Fecha no disponible';
            }
        }

        // 🔵 FUNCIÓN PARA CARGAR LA PLANTILLA (BASE O EVENTUAL)
        async function loadPlantilla() {
            showLoading(true);
            hideErrors();
            const fechaElement = document.getElementById('fecha-texto');

            try {
                console.log(`Consultando API para: ${ESTADO_FIJO}/${tipoDocumentoActual}`);
                const response = await fetch(`${BACKEND_URL}/archivos/${ESTADO_FIJO}/${tipoDocumentoActual}`, {
                    headers: { 'x-api-key': API_KEY }
                });

                if (!response.ok) throw new Error(`Error ${response.status}: ${response.statusText}`);

                const result = await response.json();
                console.log('Respuesta API:', result);

                if (!result?.data) throw new Error('Formato de respuesta inválido');

                const pdfViewer = document.getElementById('pdf-viewer');
                const mobileContainer = document.querySelector('.mobile-images');

                if (result.data.length > 0) {
                    const latestPDF = result.data.sort((a, b) => 
                        new Date(b.uploaded_at) - new Date(a.uploaded_at)
                    )[0];

                    // Mostrar fecha de actualización
                    fechaElement.textContent = formatDate(latestPDF.uploaded_at);
                    
                    // Configuración normal para PC
                    pdfViewer.src = latestPDF.url;
                    
                    // Configuración para móviles
                    if (!isIOS()) {
                        mobileContainer.innerHTML = `
                            <div class="file-info">
                                <h3>${latestPDF.filename || (tipoDocumentoActual === TIPO_BASE ? 'Plantilla Base' : 'Plantilla Eventual')}</h3>
                                <p>Actualizado: ${formatDate(latestPDF.uploaded_at)}</p>
                                <p>Tamaño: ${(latestPDF.size / (1024*1024)).toFixed(2)} MB</p>
                                <a href="${latestPDF.url}" class="download-btn" download>
                                    Descargar Documento
                                </a>
                            </div>
                        `;
                    }
                } else {
                    // Mensaje de error específico según el tipo
                    let mensajeError = tipoDocumentoActual === TIPO_BASE 
                        ? 'No se encontraron documentos de plantilla base para Ciudad de México'
                        : 'No se encontraron documentos de plantilla eventual para Ciudad de México';
                    
                    showError(mensajeError, 'both');
                    fechaElement.textContent = 'No disponible';
                }
            } catch (error) {
                console.error('Error:', error);
                showError(`Error al cargar la plantilla: ${error.message}`, 'both');
                fechaElement.textContent = 'Error al cargar';
            } finally {
                showLoading(false);
            }
        }

        // 🔵 FUNCIÓN PARA ACTUALIZAR BOTONES ACTIVOS
        function actualizarBotonesActivos() {
            // Remover clase 'activo' de todos los botones
            document.querySelectorAll('.btn-plantilla').forEach(btn => {
                btn.classList.remove('activo');
            });
            
            // Agregar clase 'activo' al botón correspondiente
            if (tipoDocumentoActual === TIPO_BASE) {
                document.getElementById('btn-plantilla-base').classList.add('activo');
            } else {
                document.getElementById('btn-plantilla-eventual').classList.add('activo');
            }
        }

        // 🔵 FUNCIÓN PARA CAMBIAR ENTRE PLANTILLAS
        function cambiarPlantilla(tipo) {
            tipoDocumentoActual = tipo;
            actualizarBotonesActivos();
            cargarTituloPersonalizado(tipo);
            loadPlantilla();
        }

        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            // Configurar event listeners para los botones
            document.getElementById('btn-plantilla-base').addEventListener('click', function() {
                console.log('Cambiando a Plantilla Base');
                cambiarPlantilla(TIPO_BASE);
            });
            
            document.getElementById('btn-plantilla-eventual').addEventListener('click', function() {
                console.log('Cambiando a Plantilla Eventual');
                cambiarPlantilla(TIPO_EVENTUAL);
            });
            
            // Cargar inicialmente la plantilla base
            cargarTituloPersonalizado(TIPO_BASE);
            if (document.getElementById('pdf-viewer')) {
                loadPlantilla();
            }
        });
    </script>
</body>
</html>
