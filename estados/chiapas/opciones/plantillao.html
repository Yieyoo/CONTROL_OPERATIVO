<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PLANTILLA DE PERSONAL - Chiapas</title>
    <link rel="icon" type="image/png" href="../../../imagenes/pasaporte.png">
    <link rel="stylesheet" href="../../diseños/generaldoc.css">
    
    <!-- ✅ SCRIPTS ESENCIALES -->
    <script src="../../../auth.js" defer></script>
    <script src="../../../load-menu.js" defer></script>
    
    <style>
        /* Estilo para la fecha de actualización */
        #fecha-subida {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background-color: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 1000;
        }

        /* Estilos para el botón de alternar documento */
        #toggle-doc-btn {
            position: fixed;
            top: 100px;
            right: 20px;
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: background-color 0.3s;
        }

        #toggle-doc-btn:hover {
            background-color: #34495e;
        }

        @media (max-width: 768px) {
            #fecha-subida {
                font-size: 10px;
                padding: 3px 6px;
            }
            
            #toggle-doc-btn {
                top: 80px;
                right: 10px;
                padding: 8px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="header-lineas">
        <div class="linea-superior"></div>
        <div class="linea-inferior"></div>
    </div>
    <!-- EL MENÚ SE INSERTA AUTOMÁTICAMENTE AQUÍ POR load-menu.js -->

    <!-- Botón para alternar documentos -->
    <button id="toggle-doc-btn">Mostrar Plantilla Eventual</button>

    <!-- Contenedor para el título personalizado -->
    <div id="tituloContainer" class="titulo-personalizado">
        Cargando título...
    </div>
    
    <div class="loading" id="loading">
        <div class="spinner"></div>
    </div>

    <div class="logo-container">
        <img src="../../../imagenes/inm logo.png" alt="Logo INM">
    </div>
    
    <div class="pdf-container">
        <iframe 
            id="pdf-viewer" 
            class="pdf-embed"
            frameborder="0"
            title="Visualizador de PDF"
        ></iframe>
        <div id="pdf-error" class="error-message" style="display: none;"></div>
    </div>

    <div class="mobile-images">
        <div id="mobile-error" class="error-message" style="display: none;"></div>
    </div>

    <div id="fecha-subida">
        Actualizado: <span id="fecha-texto">Cargando...</span>
    </div>

    <button class="regresar-btn" onclick="window.location.href = '../chiapasindex.html'">Regresar</button>

    <script>
        // ================================================
        // ✅ CONFIGURACIÓN DE DOCUMENTOS
        // ================================================
        // Configuración
        const BACKEND_URL = 'https://control-operativo-1.onrender.com/api';
        const API_KEY = 'Xhy2md57';
        const ESTADO_FIJO = 'chiapas';
        const TIPO_DOCUMENTO = 'plantilla_personal'; // Documento principal
        const TIPO_DOCUMENTO_ALTERNATIVO = 'plantilla_eventual'; // Documento alternativo
        
        // Variables para controlar documentos alternativos
        let documentoActual = 'principal'; // 'principal' o 'alternativo'
        let documentosDisponibles = [];

        // Detectar iOS
        function isIOS() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                   (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        }

        // Función para obtener y cargar el título personalizado
        async function cargarTituloPersonalizado() {
            const tituloContainer = document.getElementById('tituloContainer');

            try {
                // 1. Obtener el archivo más reciente con título
                const archivosResponse = await fetch(`${BACKEND_URL}/archivos/${ESTADO_FIJO}/${TIPO_DOCUMENTO}`, {
                    headers: { 'x-api-key': API_KEY }
                });

                if (archivosResponse.ok) {
                    const { data: archivos } = await archivosResponse.json();
                    if (archivos.length > 0) {
                        documentosDisponibles = archivos.sort((a, b) => 
                            new Date(b.uploaded_at) - new Date(a.uploaded_at)
                        );
                        
                        const ultimoArchivo = documentosDisponibles[0];
                        if (ultimoArchivo.titulo_documento) {
                            tituloContainer.textContent = ultimoArchivo.titulo_documento;
                            return;
                        }
                    }
                }

                // 2. Obtener desde endpoint de títulos
                const tituloResponse = await fetch(`${BACKEND_URL}/obtener-titulo-global`, {
                    headers: { 'x-api-key': API_KEY }
                });

                if (tituloResponse.ok) {
                    const data = await tituloResponse.json();
                    if (data.titulo) {
                        tituloContainer.textContent = data.titulo;
                        return;
                    }
                }

                // 3. Título por defecto
                tituloContainer.textContent = 'Plantilla de Personal - Chiapas';

            } catch (error) {
                console.error('Error:', error);
                tituloContainer.textContent = 'Plantilla de Personal - Chiapas';
                tituloContainer.style.color = 'red';
            }
        }

        // Mostrar/ocultar loading
        function showLoading(show) {
            const loading = document.getElementById('loading');
            if (loading) loading.style.display = show ? 'flex' : 'none';
        }

        // Mostrar mensaje de error - VERSIÓN CORREGIDA
        function showError(message, target = 'both') {
            if (target === 'both' || target === 'pdf') {
                const pdfError = document.getElementById('pdf-error');
                if (pdfError) {
                    pdfError.textContent = message;
                    pdfError.style.display = 'block';
                }
            }
            if (target === 'both' || target === 'mobile') {
                const mobileError = document.getElementById('mobile-error');
                if (mobileError) {
                    mobileError.textContent = message;
                    mobileError.style.display = 'block';
                }
            }
        }

        // Ocultar errores - VERSIÓN CORREGIDA
        function hideErrors() {
            const pdfError = document.getElementById('pdf-error');
            const mobileError = document.getElementById('mobile-error');
            
            if (pdfError) pdfError.style.display = 'none';
            if (mobileError) mobileError.style.display = 'none';
        }

        // Formatear fecha legible
        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('es-MX', options);
        }

        // Función para alternar entre documentos
        async function alternarDocumento() {
            showLoading(true);
            hideErrors();
            
            try {
                if (documentoActual === 'principal') {
                    // Cargar documento alternativo (plantilla_eventual)
                    console.log(`Consultando documento alternativo: ${ESTADO_FIJO}/${TIPO_DOCUMENTO_ALTERNATIVO}`);
                    const response = await fetch(`${BACKEND_URL}/archivos/${ESTADO_FIJO}/${TIPO_DOCUMENTO_ALTERNATIVO}`, {
                        headers: { 'x-api-key': API_KEY }
                    });

                    if (!response.ok) throw new Error(`Error ${response.status}: ${response.statusText}`);

                    const result = await response.json();
                    
                    if (result?.data && result.data.length > 0) {
                        const documentosAlternativos = result.data.sort((a, b) => 
                            new Date(b.uploaded_at) - new Date(a.uploaded_at)
                        );
                        
                        const documentoAlternativo = documentosAlternativos[0];
                        cargarDocumento(documentoAlternativo, 'alternativo');
                        document.getElementById('toggle-doc-btn').textContent = 'Mostrar Plantilla Personal';
                        documentoActual = 'alternativo';
                    } else {
                        alert('No se encontró la Plantilla Eventual');
                    }
                } else {
                    // Volver al documento principal (plantilla_personal)
                    if (documentosDisponibles.length > 0) {
                        const primerDocumento = documentosDisponibles[0];
                        cargarDocumento(primerDocumento, 'principal');
                        document.getElementById('toggle-doc-btn').textContent = 'Mostrar Plantilla Eventual';
                        documentoActual = 'principal';
                    }
                }
            } catch (error) {
                console.error('Error al alternar documento:', error);
                alert(`Error al cargar documento alternativo: ${error.message}`);
            } finally {
                showLoading(false);
            }
        }

        // Función para cargar un documento específico
        function cargarDocumento(documento, tipo) {
            const pdfViewer = document.getElementById('pdf-viewer');
            const mobileContainer = document.querySelector('.mobile-images');
            const fechaElement = document.getElementById('fecha-texto');
            const tituloContainer = document.getElementById('tituloContainer');
            
            if (!pdfViewer || !fechaElement || !tituloContainer) {
                console.error('Elementos del DOM no encontrados');
                return;
            }
            
            // Actualizar fecha
            fechaElement.textContent = formatDate(documento.uploaded_at);
            
            // Cargar PDF
            pdfViewer.src = documento.url;
            
            // Configurar para móviles
            if (!isIOS() && mobileContainer) {
                const tipoTexto = tipo === 'principal' ? 'Plantilla Personal' : 'Plantilla Eventual';
                mobileContainer.innerHTML = `
                    <div class="file-info">
                        <h3>${documento.filename || tipoTexto}</h3>
                        <p>Actualizado: ${formatDate(documento.uploaded_at)}</p>
                        <p>Tamaño: ${(documento.size / (1024*1024)).toFixed(2)} MB</p>
                        <p><em>${tipoTexto}</em></p>
                        <a href="${documento.url}" class="download-btn" download>
                            Descargar Documento
                        </a>
                    </div>
                `;
            }
            
            // Actualizar título si está disponible
            if (documento.titulo_documento) {
                tituloContainer.textContent = 
                    `${documento.titulo_documento} ${tipo === 'alternativo' ? '(Eventual)' : '(Personal)'}`;
            } else {
                // Título por defecto según el tipo
                tituloContainer.textContent = tipo === 'principal' 
                    ? 'Plantilla de Personal - Chiapas' 
                    : 'Plantilla Eventual - Chiapas';
            }
        }

        // Cargar PDF de Plantilla de Personal
        async function loadPlantillaPersonal() {
            showLoading(true);
            hideErrors();
            const fechaElement = document.getElementById('fecha-texto');

            try {
                console.log(`Consultando API para: ${ESTADO_FIJO}/${TIPO_DOCUMENTO}`);
                const response = await fetch(`${BACKEND_URL}/archivos/${ESTADO_FIJO}/${TIPO_DOCUMENTO}`, {
                    headers: { 'x-api-key': API_KEY }
                });

                if (!response.ok) throw new Error(`Error ${response.status}: ${response.statusText}`);

                const result = await response.json();
                console.log('Respuesta API:', result);

                if (!result?.data) throw new Error('Formato de respuesta inválido');

                if (result.data.length > 0) {
                    documentosDisponibles = result.data.sort((a, b) => 
                        new Date(b.uploaded_at) - new Date(a.uploaded_at)
                    );
                    
                    // Cargar el documento principal (más reciente)
                    const primerDocumento = documentosDisponibles[0];
                    cargarDocumento(primerDocumento, 'principal');
                    
                    // Configurar botón de alternar
                    const toggleBtn = document.getElementById('toggle-doc-btn');
                    if (toggleBtn) toggleBtn.style.display = 'block';
                } else {
                    showError('No se encontraron documentos de plantilla de personal', 'both');
                    if (fechaElement) fechaElement.textContent = 'No disponible';
                    
                    const toggleBtn = document.getElementById('toggle-doc-btn');
                    if (toggleBtn) toggleBtn.style.display = 'none';
                }
            } catch (error) {
                console.error('Error:', error);
                showError(`Error al cargar la plantilla: ${error.message}`, 'both');
                if (fechaElement) fechaElement.textContent = 'Error al cargar';
                
                const toggleBtn = document.getElementById('toggle-doc-btn');
                if (toggleBtn) toggleBtn.style.display = 'none';
            } finally {
                showLoading(false);
            }
        }

        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            cargarTituloPersonalizado();
            
            // Configurar evento para el botón de alternar
            const toggleBtn = document.getElementById('toggle-doc-btn');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', alternarDocumento);
            }
            
            if (document.getElementById('pdf-viewer')) {
                loadPlantillaPersonal();
            }
        });
    </script>
</body>
</html>
