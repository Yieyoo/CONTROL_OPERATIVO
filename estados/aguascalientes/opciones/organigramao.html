<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Organigrama</title>
    <link rel="icon" type="image/png" href="../../../imagenes/organigrama.png">
    <link rel="stylesheet" href="../../diseños/generaldoc.css">
    <script src="../../../auth.js" defer></script>   
    <script src="../../../load-menu.js" defer></script>
    
    <style>
        /* Estilo para la fecha de actualización */
        #fecha-subida {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background-color: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 1000;
        }

        /* Estilos para el botón de alternar documento */
        #toggle-doc-btn {
            position: fixed;
            top: 100px;
            right: 20px;
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: background-color 0.3s;
        }

        #toggle-doc-btn:hover {
            background-color: #34495e;
        }

        @media (max-width: 768px) {
            #fecha-subida {
                font-size: 10px;
                padding: 3px 6px;
            }
            
            #toggle-doc-btn {
                top: 80px;
                right: 10px;
                padding: 8px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="header-lineas">
        <div class="linea-superior"></div>
        <div class="linea-inferior"></div>
    </div>
    <!-- EL MENÚ SE INSERTA AUTOMÁTICAMENTE AQUÍ POR load-menu.js -->

    <!-- Botón para alternar documentos -->
    <button id="toggle-doc-btn" style="display: none;">Mostrar Documento Alternativo</button>

    <!-- Contenedor para el título personalizado -->
    <div id="tituloContainer" class="titulo-personalizado">
        Organigrama
    </div>
    
    <div class="loading" id="loading">
        <div class="spinner"></div>
    </div>
    <div class="logo-container">
        <img src="../../../imagenes/inm logo.png" alt="Logo INM">
    </div>
    
    <div class="pdf-container">
        <iframe 
            id="pdf-viewer" 
            class="pdf-embed"
            frameborder="0"
            title="Visualizador de PDF"
        ></iframe>
        <div id="pdf-error" class="error-message" style="display: none;"></div>
    </div>

    <!-- Contenedor específico para iOS (oculto en otros dispositivos) -->
    <div id="ios-container" class="ios-only">
        <p>Para visualizar el documento en tu dispositivo iOS:</p>
        <a href="#" id="ios-pdf-link" class="ios-pdf-link" download>
            <span>Descargar Documento</span>
        </a>
        <p class="ios-instructions">Toca el botón arriba para descargar el PDF a tu dispositivo</p>
    </div>

    <div class="mobile-images">
        <div id="mobile-error" class="error-message" style="display: none;"></div>
    </div>

    <div id="fecha-subida">
        Actualizado: <span id="fecha-texto">Cargando...</span>
    </div>

    <button class="regresar-btn" onclick="window.location.href = '../baja_californiaindex.html'">Regresar</button>

    <script>
        // ================================================
        // ✅ CONFIGURACIÓN DE DOCUMENTOS
        // ================================================
        // Configuración
        const BACKEND_URL = 'https://control-operativo-1.onrender.com/api';
        const API_KEY = 'Xhy2md57';
        const ESTADO_FIJO = 'aguascalientes';
        const TIPO_DOCUMENTO = 'organigrama'; // Documento principal
        const TIPO_DOCUMENTO_ALTERNATIVO = 'organigrama_or'; // Documento alternativo (ajusta según necesites)
        
        // Variables para controlar documentos alternativos
        let documentoActual = 'principal'; // 'principal' o 'alternativo'
        let documentosDisponibles = [];
        let tituloPrincipalCompleto = ''; // Almacena el título completo del documento principal

        // Detectar iOS
        function isIOS() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                   (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        }

        // Función para obtener el título del documento principal desde Cloudinary
        async function obtenerTituloPrincipal() {
            try {
                const response = await fetch(`${BACKEND_URL}/archivos/${ESTADO_FIJO}/${TIPO_DOCUMENTO}`, {
                    headers: { 'x-api-key': API_KEY }
                });

                if (response.ok) {
                    const { data: archivos } = await response.json();
                    if (archivos.length > 0) {
                        const ultimoArchivo = archivos.sort((a, b) => 
                            new Date(b.uploaded_at) - new Date(a.uploaded_at)
                        )[0];
                        
                        if (ultimoArchivo.titulo_documento) {
                            return ultimoArchivo.titulo_documento;
                        }
                    }
                }
            } catch (error) {
                console.error('Error al obtener título principal:', error);
            }
            
            // Título por defecto
            return 'Organigrama - Baja California';
        }

        // Función para actualizar el título en la página
        function actualizarTituloPagina(tipoDocumento = 'principal', documento = null) {
            const tituloContainer = document.getElementById('tituloContainer');
            
            if (documento && documento.titulo_documento) {
                tituloContainer.textContent = documento.titulo_documento;
            } else if (tipoDocumento === 'principal') {
                if (tituloPrincipalCompleto) {
                    tituloContainer.textContent = tituloPrincipalCompleto;
                } else {
                    tituloContainer.textContent = 'Organigrama - Baja California';
                }
            } else {
                tituloContainer.textContent = 'Organigrama Alternativo - Baja California';
            }
        }

        // Mostrar/ocultar loading
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }

        // Mostrar mensaje de error
        function showError(message, target = 'both') {
            if (target === 'both' || target === 'pdf') {
                const pdfError = document.getElementById('pdf-error');
                pdfError.textContent = message;
                pdfError.style.display = 'block';
            }
            if (target === 'both' || target === 'mobile') {
                const mobileError = document.getElementById('mobile-error');
                mobileError.textContent = message;
                mobileError.style.display = 'block';
            }
        }

        // Ocultar errores
        function hideErrors() {
            document.getElementById('pdf-error').style.display = 'none';
            document.getElementById('mobile-error').style.display = 'none';
        }

        // Formatear fecha legible
        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('es-MX', options);
        }

        // Configurar descarga para iOS
        function configurarDescargaiOS(documento) {
            const iosLink = document.getElementById('ios-pdf-link');
            
            if (isIOS()) {
                iosLink.href = documento.url;
                iosLink.setAttribute('download', documento.filename || 'organigrama.pdf');
            }
        }

        // Función para alternar entre documentos
        async function alternarDocumento() {
            showLoading(true);
            hideErrors();
            
            try {
                if (documentoActual === 'principal') {
                    // Cargar documento alternativo
                    console.log(`Consultando documento alternativo: ${ESTADO_FIJO}/${TIPO_DOCUMENTO_ALTERNATIVO}`);
                    const response = await fetch(`${BACKEND_URL}/archivos/${ESTADO_FIJO}/${TIPO_DOCUMENTO_ALTERNATIVO}`, {
                        headers: { 'x-api-key': API_KEY }
                    });

                    if (!response.ok) throw new Error(`Error ${response.status}: ${response.statusText}`);

                    const result = await response.json();
                    
                    if (result?.data && result.data.length > 0) {
                        const documentosAlternativos = result.data.sort((a, b) => 
                            new Date(b.uploaded_at) - new Date(a.uploaded_at)
                        );
                        
                        const documentoAlternativo = documentosAlternativos[0];
                        cargarDocumento(documentoAlternativo, 'alternativo');
                        
                        // Configurar descarga iOS
                        configurarDescargaiOS(documentoAlternativo);
                        
                        // Actualizar botón y estado
                        document.getElementById('toggle-doc-btn').textContent = 'Mostrar Organigrama Principal';
                        documentoActual = 'alternativo';
                        
                        // Actualizar título de la página
                        actualizarTituloPagina('alternativo', documentoAlternativo);
                    } else {
                        alert('No se encontró el documento alternativo');
                    }
                } else {
                    // Volver al documento principal
                    if (documentosDisponibles.length > 0) {
                        const primerDocumento = documentosDisponibles[0];
                        cargarDocumento(primerDocumento, 'principal');
                        
                        // Configurar descarga iOS
                        configurarDescargaiOS(primerDocumento);
                        
                        // Actualizar botón y estado
                        document.getElementById('toggle-doc-btn').textContent = 'Mostrar Organigrama Detallado';
                        documentoActual = 'principal';
                        
                        // Actualizar título de la página
                        actualizarTituloPagina('principal', primerDocumento);
                    }
                }
            } catch (error) {
                console.error('Error al alternar documento:', error);
                alert(`Error al cargar documento alternativo: ${error.message}`);
            } finally {
                showLoading(false);
            }
        }

        // Función para cargar un documento específico
        function cargarDocumento(documento, tipo) {
            const pdfViewer = document.getElementById('pdf-viewer');
            const mobileContainer = document.querySelector('.mobile-images');
            const fechaElement = document.getElementById('fecha-texto');
            
            if (!pdfViewer || !fechaElement) {
                console.error('Elementos del DOM no encontrados');
                return;
            }
            
            // Actualizar fecha
            fechaElement.textContent = formatDate(documento.uploaded_at);
            
            // Actualizar título del documento en la página
            document.title = documento.filename || 'Organigrama';
            
            // Cargar PDF
            pdfViewer.src = documento.url;
            
            // Configurar para móviles (no iOS)
            if (!isIOS() && mobileContainer) {
                const tipoTexto = tipo === 'principal' ? 'Principal' : 'Detallado';
                mobileContainer.innerHTML = `
                    <div class="file-info">
                        <h3>${documento.filename || `Organigrama ${tipoTexto}`}</h3>
                        <p>Actualizado: ${formatDate(documento.uploaded_at)}</p>
                        <p>Tamaño: ${(documento.size / (1024*1024)).toFixed(2)} MB</p>
                        <p><em>${tipoTexto}</em></p>
                        <a href="${documento.url}" class="download-btn" download>
                            Descargar Documento
                        </a>
                    </div>
                `;
            }
        }

        // Cargar PDF de Organigrama
        async function cargarOrganigrama() {
            showLoading(true);
            hideErrors();

            try {
                console.log(`Consultando API para: ${ESTADO_FIJO}/${TIPO_DOCUMENTO}`);
                const response = await fetch(`${BACKEND_URL}/archivos/${ESTADO_FIJO}/${TIPO_DOCUMENTO}`, {
                    headers: { 'x-api-key': API_KEY }
                });

                if (!response.ok) throw new Error(`Error ${response.status}: ${response.statusText}`);

                const result = await response.json();
                console.log('Respuesta API:', result);

                if (!result?.data) throw new Error('Formato de respuesta inválido');

                if (result.data.length > 0) {
                    documentosDisponibles = result.data.sort((a, b) => 
                        new Date(b.uploaded_at) - new Date(a.uploaded_at)
                    );
                    
                    // Cargar el documento principal (más reciente)
                    const primerDocumento = documentosDisponibles[0];
                    cargarDocumento(primerDocumento, 'principal');
                    
                    // Configurar descarga para iOS
                    configurarDescargaiOS(primerDocumento);
                    
                    // Obtener y guardar el título principal
                    tituloPrincipalCompleto = await obtenerTituloPrincipal();
                    
                    // Actualizar título de la página
                    actualizarTituloPagina('principal', primerDocumento);
                    
                    // Mostrar botón de alternar si existe documento alternativo
                    const toggleBtn = document.getElementById('toggle-doc-btn');
                    if (toggleBtn) {
                        // Verificar si hay documento alternativo disponible
                        try {
                            const responseAlt = await fetch(`${BACKEND_URL}/archivos/${ESTADO_FIJO}/${TIPO_DOCUMENTO_ALTERNATIVO}`, {
                                headers: { 'x-api-key': API_KEY }
                            });
                            
                            if (responseAlt.ok) {
                                const resultAlt = await responseAlt.json();
                                if (resultAlt?.data && resultAlt.data.length > 0) {
                                    toggleBtn.style.display = 'block';
                                    toggleBtn.textContent = 'Mostrar Organigrama Detallado';
                                } else {
                                    toggleBtn.style.display = 'none';
                                }
                            } else {
                                toggleBtn.style.display = 'none';
                            }
                        } catch (error) {
                            console.log('No se encontró documento alternativo');
                            toggleBtn.style.display = 'none';
                        }
                    }
                } else {
                    showError(`No se encontraron documentos de organigrama para ${ESTADO_FIJO}`, 'both');
                    const fechaElement = document.getElementById('fecha-texto');
                    if (fechaElement) fechaElement.textContent = 'No disponible';
                    
                    const toggleBtn = document.getElementById('toggle-doc-btn');
                    if (toggleBtn) toggleBtn.style.display = 'none';
                }
            } catch (error) {
                console.error('Error:', error);
                showError(`Error al cargar el documento: ${error.message}`, 'both');
                const fechaElement = document.getElementById('fecha-texto');
                if (fechaElement) fechaElement.textContent = 'Error al cargar';
                
                const toggleBtn = document.getElementById('toggle-doc-btn');
                if (toggleBtn) toggleBtn.style.display = 'none';
            } finally {
                showLoading(false);
            }
        }

        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            // Configurar evento para el botón de alternar
            const toggleBtn = document.getElementById('toggle-doc-btn');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', alternarDocumento);
            }
            
            // Cargar documento principal
            if (document.getElementById('pdf-viewer')) {
                cargarOrganigrama();
            }
        });
    </script>
</body>
</html>
