<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Sistema de Control Operativo INM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a3e72 0%, #0d2b57 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            width: 120px;
            margin-bottom: 20px;
        }

        h1 {
            color: #1a3e72;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #1a3e72;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background: #1a3e72;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-button:hover {
            background: #0d2b57;
        }

        .login-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .error-message {
            color: #dc3545;
            margin-top: 10px;
            padding: 10px;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 5px;
            display: none;
        }

        .success-message {
            color: #28a745;
            margin-top: 10px;
            padding: 10px;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 5px;
            display: none;
        }

        .loading {
            display: none;
            margin-top: 10px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1a3e72;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .system-info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #666;
            font-size: 0.9rem;
        }

        .user-credentials {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 0.8rem;
        }

        .user-credentials h4 {
            margin-bottom: 10px;
            color: #1a3e72;
        }

        .credential {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="imagenes/inm logo.png" alt="Logo INM" class="logo" onerror="this.style.display='none'">
        <h1>Control Operativo INM</h1>
        <p class="subtitle">Sistema de Gestión de Archivos</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" required autocomplete="username" placeholder="Ingresa tu usuario">
            </div>
            
            <div class="input-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Ingresa tu contraseña">
            </div>
            
            <button type="submit" class="login-button" id="loginButton">
                Iniciar Sesión
            </button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Verificando credenciales...</p>
            </div>
            
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
        </form>

        <!-- Solo para desarrollo - Mostrar credenciales -->
        <div class="user-credentials">
            <h4>Credenciales del Sistema:</h4>
            <div class="credential">
                <strong>Usuario:</strong> admin
            </div>
            <div class="credential">
                <strong>Contraseña:</strong> admin123
            </div>
        </div>
        
        <div class="system-info">
            <p><strong>Sistema restringido</strong></p>
            <p>Acceso solo para personal autorizado</p>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://control-operativo-1.onrender.com/api';
        
        // Elementos del DOM
        const loginForm = document.getElementById('loginForm');
        const loginButton = document.getElementById('loginButton');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        // Mostrar/ocultar mensajes
        function showMessage(element, message, isError = true) {
            if (isError) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
                successMessage.style.display = 'none';
            } else {
                successMessage.textContent = message;
                successMessage.style.display = 'block';
                errorMessage.style.display = 'none';
            }
        }

        function hideMessages() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
        }

        // Mostrar/ocultar loading
        function setLoading(loadingState) {
            if (loadingState) {
                loading.style.display = 'block';
                loginButton.disabled = true;
                loginButton.textContent = 'Verificando...';
            } else {
                loading.style.display = 'none';
                loginButton.disabled = false;
                loginButton.textContent = 'Iniciar Sesión';
            }
        }

        // Verificar si ya está autenticado
        async function checkExistingAuth() {
            try {
                console.log('🔍 Verificando sesión existente...');
                
                const response = await fetch(`${BACKEND_URL}/auth/check`, {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('📋 Estado de autenticación:', data.data.authenticated);
                    
                    if (data.data.authenticated) {
                        console.log('✅ Sesión activa encontrada, redirigiendo...');
                        window.location.href = 'index.html';
                        return true;
                    }
                }
                return false;
            } catch (error) {
                console.log('🚫 Error al verificar sesión:', error);
                return false;
            }
        }

        // Manejar el envío del formulario
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                showMessage(errorMessage, 'Por favor completa todos los campos');
                return;
            }
            
            setLoading(true);
            hideMessages();
            
            try {
                console.log('🔐 Intentando login...');
                
                const response = await fetch(`${BACKEND_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && data.status === 'success') {
                    showMessage(successMessage, `✅ ${data.message}`, false);
                    
                    // Redirigir después de 1 segundo
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                    
                } else {
                    showMessage(errorMessage, data.message || 'Error al iniciar sesión');
                    setLoading(false);
                }
                
            } catch (error) {
                console.error('💥 Error de conexión:', error);
                showMessage(errorMessage, 'Error de conexión con el servidor');
                setLoading(false);
            }
        });

        // Verificar autenticación al cargar la página
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Página de login cargada');
            checkExistingAuth();
        });

        // Limpiar mensajes al cambiar los inputs
        document.getElementById('username').addEventListener('input', hideMessages);
        document.getElementById('password').addEventListener('input', hideMessages);

        // Enter para enviar el formulario
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loginForm.dispatchEvent(new Event('submit'));
            }
        });

        // Auto-completar credenciales para testing (solo en desarrollo)
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            document.getElementById('username').value = 'admin';
            document.getElementById('password').value = 'admin123';
        }
    </script>
</body>
</html>
