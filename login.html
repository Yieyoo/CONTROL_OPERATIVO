<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Acceso - Sistema de Control Operativo INM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: url('imagenes/fondo.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(30, 8, 15, 0.60);
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            right: 0;
            width: 45%;
            height: 100vh;
            background-image: url('imagenes/fondoderecha.jpg');
            background-size: cover;
            background-position: left center;
            background-repeat: no-repeat;
            z-index: -1;
            pointer-events: none;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.97);
            padding: 44px 40px 36px;
            border-radius: 16px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #691932, #A5852E, #691932);
        }

        .logo {
            width: 130px;
            margin-bottom: 18px;
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.04);
        }

        h1 {
            color: #691932;
            margin-bottom: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.35;
        }

        .subtitle {
            color: #888;
            margin-bottom: 28px;
            font-size: 0.88rem;
            letter-spacing: 0.4px;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #444;
            font-weight: 600;
            font-size: 0.88rem;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 2px solid #e5dbd4;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.25s ease;
            background: #faf8f6;
        }

        input:focus {
            outline: none;
            border-color: #691932;
            background: white;
            box-shadow: 0 0 0 3px rgba(105, 25, 50, 0.1);
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #999;
            font-size: 1rem;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #691932 0%, #4d1224 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.4px;
        }

        .login-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(105, 25, 50, 0.45);
        }

        .login-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .login-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .button-loading .button-text {
            visibility: hidden;
            opacity: 0;
        }

        .button-loading::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            margin: auto;
            border: 2px solid transparent;
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: button-spinner 1s ease infinite;
        }

        @keyframes button-spinner {
            from { transform: rotate(0turn); }
            to   { transform: rotate(1turn); }
        }

        .error-message {
            color: #c62828;
            margin-top: 14px;
            padding: 11px 14px;
            background: #ffebee;
            border: 1px solid #ef9a9a;
            border-radius: 8px;
            display: none;
            font-size: 0.88rem;
            line-height: 1.4;
        }

        .success-message {
            color: #2e7d32;
            margin-top: 14px;
            padding: 11px 14px;
            background: #e8f5e9;
            border: 1px solid #a5d6a7;
            border-radius: 8px;
            display: none;
            font-size: 0.88rem;
        }

        .loading {
            display: none;
            margin-top: 14px;
            text-align: center;
        }

        .spinner {
            border: 3px solid #f0e8eb;
            border-top: 3px solid #691932;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto 8px;
        }

        @keyframes spin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .system-info {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid rgba(165, 133, 46, 0.2);
            color: #888;
            font-size: 0.82rem;
            line-height: 1.5;
        }

        .lockout-message {
            color: #c62828;
            margin-top: 14px;
            padding: 11px 14px;
            background: #ffebee;
            border: 1px solid #ef9a9a;
            border-radius: 8px;
            display: none;
            font-size: 0.88rem;
        }

        .session-info {
            background: rgba(105, 25, 50, 0.07);
            padding: 9px 12px;
            border-radius: 6px;
            margin-top: 12px;
            font-size: 0.8rem;
            color: #691932;
            display: none;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 32px 22px 28px;
            }
            h1 { font-size: 1rem; }
            input { padding: 11px 12px; }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25%       { transform: translateX(-5px); }
            75%       { transform: translateX(5px); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="imagenes/unnamed.png" alt="Logo INM" class="logo" onerror="this.style.display='none'">
        <h1>Dirección General de Coordinación de Oficinas de Representación</h1>
        <p class="subtitle">Sistema de Control Operativo</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" required autocomplete="username" 
                       placeholder="Ingresa tu usuario" autofocus>
            </div>
            
            <div class="input-group">
                <label for="password">Contraseña:</label>
                <div class="password-container">
                    <input type="password" id="password" name="password" required 
                           autocomplete="current-password" placeholder="Ingresa tu contraseña">
                    <button type="button" class="toggle-password" id="togglePassword">👁️</button>
                </div>
            </div>
            
            <button type="submit" class="login-button" id="loginButton">
                <span class="button-text">Iniciar Sesión</span>
            </button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Verificando credenciales...</p>
            </div>
            
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
            <div class="lockout-message" id="lockoutMessage"></div>
            <div class="session-info" id="sessionInfo"></div>
        </form>
        
        <div class="system-info">
            <p><strong>🔒 Sistema restringido</strong></p>
            <p>Acceso solo para personal autorizado del INM</p>
            <p style="margin-top: 8px; font-size: 0.8rem; color: #888;">
                Sesión válida por 8 horas
            </p>
        </div>
    </div>

    <script>
        const elements = {
            form:     document.getElementById('loginForm'),
            button:   document.getElementById('loginButton'),
            loading:  document.getElementById('loading'),
            error:    document.getElementById('errorMessage'),
            success:  document.getElementById('successMessage'),
            lockout:  document.getElementById('lockoutMessage'),
            sessionInfo: document.getElementById('sessionInfo'),
            toggle:   document.getElementById('togglePassword'),
            username: document.getElementById('username'),
            password: document.getElementById('password')
        };

        function showError(msg) {
            elements.error.textContent = msg;
            elements.error.style.display = 'block';
            elements.success.style.display = 'none';
            elements.lockout.style.display = 'none';
        }

        function showSuccess(msg) {
            elements.success.textContent = msg;
            elements.success.style.display = 'block';
            elements.error.style.display = 'none';
            elements.lockout.style.display = 'none';
        }

        function showLockout(msg) {
            elements.lockout.textContent = msg;
            elements.lockout.style.display = 'block';
            elements.error.style.display = 'none';
        }

        function hideMessages() {
            elements.error.style.display = 'none';
            elements.success.style.display = 'none';
            elements.lockout.style.display = 'none';
            elements.sessionInfo.style.display = 'none';
        }

        function setLoading(on) {
            elements.loading.style.display = on ? 'block' : 'none';
            elements.button.disabled = on;
            elements.button.classList.toggle('button-loading', on);
        }

        function shake() {
            elements.form.classList.add('shake');
            setTimeout(() => elements.form.classList.remove('shake'), 500);
        }

        // Toggle contraseña
        elements.toggle.addEventListener('click', function () {
            const isPass = elements.password.type === 'password';
            elements.password.type = isPass ? 'text' : 'password';
            this.textContent = isPass ? '🔒' : '👁️';
        });

        // Envío del formulario → validación local + localStorage
        elements.form.addEventListener('submit', function (e) {
            e.preventDefault();
            hideMessages();

            const username = elements.username.value.trim();
            const password = elements.password.value;

            if (!username || !password) {
                showError('Por favor complete todos los campos');
                shake();
                return;
            }

            setLoading(true);

            setTimeout(function () {
                if (username === 'admin' && password === 'dgcor01') {
                    localStorage.setItem('authenticated', 'true');
                    localStorage.setItem('username', username);
                    showSuccess('✅ Acceso correcto. Entrando al sistema...');
                    setTimeout(function () { window.location.replace('index.html'); }, 900);
                } else {
                    showError('❌ Usuario o contraseña incorrectos');
                    shake();
                    setLoading(false);
                }
            }, 600);
        });

        // Al cargar: si ya está autenticado, redirigir directo
        document.addEventListener('DOMContentLoaded', function () {
            elements.username.value = '';
            elements.password.value = '';
            hideMessages();
            elements.username.focus();

            if (localStorage.getItem('authenticated') === 'true') {
                window.location.replace('index.html');
            }
        });

        elements.username.addEventListener('input', hideMessages);
        elements.password.addEventListener('input', hideMessages);
    </script>
</body>
</html>
