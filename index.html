<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Control Operativo</title>
    <link rel="icon" type="image/png" sizes="48x48" href="imagenes/iconom.png">
    <link rel="stylesheet" href="styles.css">
    <script src="js/load-menu.js" defer></script>
    <style>
        /* Estilos adicionales para garantizar el funcionamiento del menú */
        nav.menu {
            z-index: 10000 !important;
        }
        .menu-overlay {
            z-index: 9999 !important;
        }
        header::before, header::after {
            z-index: 1 !important;
            pointer-events: none !important;
        }
        
        /* Pantalla de carga */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #1a3e72;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body> 
    <!-- Pantalla de carga -->
    <div id="loadingScreen">
        <div class="loading-spinner"></div>
        <h3>Verificando sesión...</h3>
        <p>Por favor espera</p>
    </div> 

    <header>
        
        <!-- Contenido del header sin el menú -->
        <div class="logo-container">
            <img src="imagenes/unnamed.png" alt="Gobernación" class="logo" id="logo-gobernacion">
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main>
        <!-- SECCIÓN PORTADA -->
        <section class="portada">
            <div class="imagen-container">
                <img src="imagenes/MujerBandera.png" alt="Imagen representativa">
            </div>
            <div class="texto-container">
                <h1>INSTITUTO NACIONAL DE MIGRACIÓN</h1>
                <h2>Dirección General de Coordinación de Oficinas de Representación</h2>
                <h3>Dirección de Control Operativo</h3>
                <div class="linea"></div>
                <h2>Información de Control Operativo</h2>
                <div class="fecha-actual" id="fechaActual"></div>
            </div>
        </section>
        <div class="contra-header"></div>     
       
        
        <!-- SECCIÓN MAPA -->
        <section class="mapa-container">
            <h2 class="titulo-mapa">Mapa Interactivo de México</h2>
            <div id="map"></div>
            <p id="mapa-error" style="color: red; display: none;"></p>
        </section>
    </main>

    <!-- Scripts -->
    <script src="mapa/html5countrymapv4.5/mapdata.js"></script>
    <script src="mapa/html5countrymapv4.5/countrymap.js"></script>

   <script>
    // Sistema mejorado de autenticación
    class AuthManager {
        constructor() {
            this.sessionDuration = 60 * 60 * 1000; // 1 hora
            this.checkAuth();
            this.setupNavigationHandlers();
        }

        checkAuth() {
            const isAuthenticated = localStorage.getItem('authenticated') === 'true';
            const loginTime = parseInt(localStorage.getItem('loginTime') || '0');
            const now = Date.now();
            
            console.log('🔐 Verificando autenticación:', {
                isAuthenticated,
                loginTime: new Date(loginTime),
                now: new Date(now),
                diferencia: now - loginTime,
                expirado: (now - loginTime) > this.sessionDuration
            });

            if (!isAuthenticated || (now - loginTime) > this.sessionDuration) {
                console.log('❌ Sesión inválida o expirada, redirigiendo a login...');
                this.redirectToLogin();
                return false;
            }

            console.log('✅ Sesión válida, mostrando contenido...');
            this.hideLoadingScreen();
            return true;
        }

        redirectToLogin() {
            // Limpiar el estado de autenticación
            localStorage.removeItem('authenticated');
            localStorage.removeItem('loginTime');
            
            // Redirigir al login de forma que no se pueda volver con el botón back
            window.location.replace('login.html');
        }

        hideLoadingScreen() {
            const loadingScreen = document.getElementById('loadingScreen');
            if (loadingScreen) {
                loadingScreen.style.display = 'none';
            }
            document.body.style.overflow = 'auto';
        }

        setupNavigationHandlers() {
            // Manejar el evento de página mostrada (back/forward)
            window.addEventListener('pageshow', (event) => {
                console.log('🔄 Página mostrada desde:', event.persisted ? 'cache' : 'nueva carga');
                
                if (event.persisted) {
                    // La página viene del cache, verificar autenticación nuevamente
                    if (!this.checkAuth()) {
                        this.redirectToLogin();
                    }
                }
            });
        }

        logout() {
            if (confirm('¿Estás seguro de que quieres cerrar sesión?')) {
                console.log('🚪 Cerrando sesión...');
                localStorage.removeItem('authenticated');
                localStorage.removeItem('loginTime');
                this.redirectToLogin();
            }
        }
    }

    // Inicializar el sistema de autenticación
    const authManager = new AuthManager();

    // Mostrar fecha actual
    document.getElementById("fechaActual").innerHTML = new Date().toLocaleDateString('es-MX', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
    });

    // Verificación de carga del mapa
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
            if (typeof simplemaps_countrymap === 'undefined') {
                document.getElementById('mapa-error').textContent = 
                    'Error: No se cargó countrymap.js. Verifica la ruta.';
                document.getElementById('mapa-error').style.display = 'block';
            }
        }, 1000);
    });

    // Efectos visuales
    document.addEventListener('DOMContentLoaded', function() {
        // Efecto de carga inicial
        setTimeout(() => {
            document.body.classList.add('loaded');
        }, 100);
        
        // Animaciones al hacer scroll
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1 });
        
        const mapas = document.querySelectorAll('.mapa-container');
        mapas.forEach(mapa => observer.observe(mapa));
    });

    // Función global para logout (para usar en el HTML)
    function logout() {
        authManager.logout();
    }
</script>
</body>
</html>
