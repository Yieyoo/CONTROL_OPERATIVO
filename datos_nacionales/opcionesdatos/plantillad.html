<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plantilla de Personal</title>
    <link rel="icon" type="image/png" href="../../../imagenes/pasaporte.png">
    <link rel="stylesheet" href="../../estados/diseños/generaldoc.css">
    
    <!-- Scripts de autenticación y menú -->
    <script src="../../auth.js" defer></script>   
    <script src="../../load-menu.js" defer></script>
    <style>
        /* Estilos para el botón de cambio de plantilla */
        .selector-plantilla {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .btn-plantilla {
            padding: 12px 24px;
            background-color: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            min-width: 180px;
        }
        
        .btn-plantilla:hover {
            background-color: #e0e0e0;
            transform: translateY(-2px);
        }
        
        .btn-plantilla.activo {
            background-color: #2c5aa0;
            color: white;
            border-color: #1e3d6f;
        }
        
        .info-plantilla {
            text-align: center;
            margin: 10px 0 20px;
            color: #666;
            font-style: italic;
        }

        /* Mejorar mensajes de error */
        .error-message {
            background: #fee;
            border: 1px solid #fcc;
            color: #c00;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            text-align: center;
        }

        .file-info {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
        }

        .download-btn {
            display: inline-block;
            background: #2c5aa0;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body class="mostrar-ubicaciones">
    <!-- HEADER DE DOS LÍNEAS -->
    <div class="header-lineas">
        <div class="linea-superior"></div>
        <div class="linea-inferior"></div>
    </div>

    <!-- El menú se insertará automáticamente aquí por load-menu.js -->
    
    <h1 id="titulo-documento" class="titulo-personalizado">PLANTILLA DE PERSONAL</h1>       
    
    <!-- Selector de tipo de plantilla -->
    <div class="selector-plantilla">
        <button id="btn-plantilla-actual" class="btn-plantilla activo" data-tipo="plantilla">
            PLANTILLA ACTUAL
        </button>
        <button id="btn-plantilla-eventual" class="btn-plantilla" data-tipo="plantilla_ne">
            PLANTILLA EVENTUAL
        </button>
    </div>
    
    <div id="info-plantilla" class="info-plantilla">
        Mostrando: Plantilla Actual
    </div>
    
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Cargando documento...</p>
    </div>
    
    <div class="logo-container">
        <img src="../../imagenes/inm logo.png" alt="Logo INM">
    </div>
    
    <div class="pdf-container">
        <iframe 
            id="pdf-viewer" 
            class="pdf-embed"
            frameborder="0"
            title="Visualizador de PDF"
        ></iframe>
        <div id="pdf-error" class="error-message" style="display: none;"></div>
    </div>

    <!-- Contenedor específico para iOS (oculto en otros dispositivos) -->
    <div id="ios-container" class="ios-only" style="display: none;">
        <p>Para visualizar el documento en tu dispositivo iOS:</p>
        <a href="#" id="ios-pdf-link" class="ios-pdf-link" download>
            <span>Descargar Documento</span>
        </a>
        <p class="ios-instructions">Toca el botón arriba para descargar el PDF a tu dispositivo</p>
    </div>

    <div class="mobile-images">
        <div id="mobile-error" class="error-message" style="display: none;"></div>
    </div>

    <!-- Botón de regreso -->
    <button class="regresar-btn" onclick="window.location.href='../datosindex.html'">
        Regresar
    </button>

<script>
    // CONFIGURACIÓN - PLANTILLA DE PERSONAL
    const BACKEND_URL = 'https://control-operativo-1.onrender.com/api';
    const API_KEY = 'Xhy2md57';
    const ESTADO = 'datos-nacionales';
    const TIPO_DOCUMENTO = 'plantilla';
    const TITULO_DOCUMENTO = 'PLANTILLA DE PERSONAL';

    // Configuración dinámica desde URL
    const params = new URLSearchParams(window.location.search);
    const estadoFromURL = params.get('estado');
    const tipoFromURL = params.get('tipo');
    const tituloFromURL = params.get('titulo');

    // Valores finales (usa los de URL si existen, sino los definidos arriba)
    const ESTADO_FIJO = estadoFromURL || ESTADO;
    const TIPO_DOC_FIJO = tipoFromURL || TIPO_DOCUMENTO;
    const TITULO_FINAL = tituloFromURL || TITULO_DOCUMENTO;

    // Variables para controlar el estado del documento
    let documentoUrl = '';
    let tipoPlantillaActual = 'plantilla'; // Valor por defecto

    // Detectar iOS
    function isIOS() {
        return /iPad|iPhone|iPod/.test(navigator.userAgent) || 
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }

    // Mostrar/ocultar loading
    function showLoading(show) {
        const loading = document.getElementById('loading');
        if (loading) {
            loading.style.display = show ? 'flex' : 'none';
        }
    }

    // Mostrar mensaje de error
    function showError(message, target = 'both') {
        console.error('Error:', message);
        
        if (target === 'both' || target === 'pdf') {
            const pdfError = document.getElementById('pdf-error');
            if (pdfError) {
                pdfError.textContent = message;
                pdfError.style.display = 'block';
            }
        }
        if (target === 'both' || target === 'mobile') {
            const mobileError = document.getElementById('mobile-error');
            if (mobileError) {
                mobileError.textContent = message;
                mobileError.style.display = 'block';
            }
        }
    }

    // Ocultar errores
    function hideErrors() {
        const pdfError = document.getElementById('pdf-error');
        const mobileError = document.getElementById('mobile-error');
        
        if (pdfError) pdfError.style.display = 'none';
        if (mobileError) mobileError.style.display = 'none';
    }

    // Formatear fecha legible
    function formatDate(dateString) {
        try {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('es-MX', options);
        } catch (error) {
            return 'Fecha no disponible';
        }
    }

    // Formatear tamaño de archivo
    function formatFileSize(bytes) {
        if (!bytes || bytes === 0) return 'Tamaño no disponible';
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(1024));
        return Math.round(bytes / Math.pow(1024, i) * 100) / 100 + ' ' + sizes[i];
    }

    // Actualizar botones activos
    function actualizarBotonesActivos(tipoSeleccionado) {
        // Remover clase activo de todos los botones
        document.querySelectorAll('.btn-plantilla').forEach(btn => {
            btn.classList.remove('activo');
        });
        
        // Agregar clase activo al botón seleccionado
        const botonSeleccionado = document.querySelector(`[data-tipo="${tipoSeleccionado}"]`);
        if (botonSeleccionado) {
            botonSeleccionado.classList.add('activo');
        }
        
        // Actualizar información mostrada
        const infoElement = document.getElementById('info-plantilla');
        if (infoElement) {
            if (tipoSeleccionado === 'plantilla') {
                infoElement.textContent = 'Mostrando: Plantilla Actual';
            } else {
                infoElement.textContent = 'Mostrando: Plantilla Eventual';
            }
        }
    }

    // Cargar PDF desde Cloudinary - VERSIÓN CORREGIDA
    async function cargarDocumentoPDF(tipoPlantilla = 'plantilla') {
        showLoading(true);
        hideErrors();
        
        // Actualizar tipo de plantilla actual
        tipoPlantillaActual = tipoPlantilla;
        
        // Actualizar botones activos
        actualizarBotonesActivos(tipoPlantilla);

        // Actualizar título de la página según el tipo de plantilla
        let tituloMostrar = TITULO_FINAL;
        if (tipoPlantilla === 'plantilla_ne') {
            tituloMostrar = 'PLANTILLA EVENTUAL DE PERSONAL';
        }
        
        document.title = tituloMostrar + ' - ' + ESTADO_FIJO.toUpperCase();
        document.getElementById('titulo-documento').textContent = tituloMostrar;

        try {
            console.log(`🔄 Consultando API para: ${ESTADO_FIJO}/${tipoPlantilla}`);
            
            // Agregar timestamp para evitar cache
            const timestamp = new Date().getTime();
            const url = `${BACKEND_URL}/archivos/${ESTADO_FIJO}/${tipoPlantilla}?t=${timestamp}`;
            
            console.log(`📡 URL de consulta: ${url}`);
            
            const response = await fetch(url, {
                headers: { 
                    'x-api-key': API_KEY,
                    'Cache-Control': 'no-cache'
                },
                cache: 'no-cache'
            });

            console.log(`📊 Estado de respuesta: ${response.status} ${response.statusText}`);

            if (!response.ok) {
                throw new Error(`Error ${response.status}: ${response.statusText}`);
            }

            const result = await response.json();
            console.log('📦 Respuesta API completa:', result);

            // VERIFICACIÓN FLEXIBLE - Acepta diferentes estructuras de respuesta
            let archivos = [];
            
            if (result && Array.isArray(result)) {
                // Caso 1: El API devuelve un array directamente
                archivos = result;
                console.log('✅ Estructura: Array directo');
            } else if (result && result.data && Array.isArray(result.data)) {
                // Caso 2: El API devuelve { data: [] }
                archivos = result.data;
                console.log('✅ Estructura: { data: array }');
            } else if (result && result.success && Array.isArray(result.data)) {
                // Caso 3: El API devuelve { success: true, data: [] }
                archivos = result.data;
                console.log('✅ Estructura: { success: true, data: array }');
            } else if (result && result.archivos && Array.isArray(result.archivos)) {
                // Caso 4: El API devuelve { archivos: [] }
                archivos = result.archivos;
                console.log('✅ Estructura: { archivos: array }');
            } else {
                console.warn('⚠️ Estructura de respuesta no reconocida:', result);
                // Intentar extraer archivos de cualquier propiedad que sea array
                for (const key in result) {
                    if (Array.isArray(result[key])) {
                        archivos = result[key];
                        console.log(`✅ Encontrado array en propiedad: ${key}`);
                        break;
                    }
                }
            }

            const pdfViewer = document.getElementById('pdf-viewer');
            const mobileContainer = document.querySelector('.mobile-images');
            const iosContainer = document.getElementById('ios-container');
            const iosLink = document.getElementById('ios-pdf-link');

            if (archivos.length > 0) {
                console.log(`📄 Se encontraron ${archivos.length} archivos`);
                
                // Ordenar por fecha y obtener el más reciente
                const latestPDF = archivos.sort((a, b) => {
                    const dateA = new Date(a.uploaded_at || a.created_at || a.fecha || 0);
                    const dateB = new Date(b.uploaded_at || b.created_at || b.fecha || 0);
                    return dateB - dateA;
                })[0];

                console.log('📋 Documento más reciente:', latestPDF);

                // Obtener URL del documento (diferentes posibles propiedades)
                const pdfUrl = latestPDF.url || latestPDF.secure_url || latestPDF.document_url || latestPDF.file_url;
                
                if (!pdfUrl) {
                    throw new Error('El documento no tiene URL válida');
                }

                // Guardar URL para descarga
                documentoUrl = pdfUrl;

                // Configuración normal para PC
                if (pdfViewer) {
                    pdfViewer.src = pdfUrl;
                    console.log('✅ PDF cargado en iframe');
                }
                
                // Configuración para móviles (no iOS)
                if (mobileContainer && !isIOS()) {
                    const filename = latestPDF.filename || latestPDF.original_filename || latestPDF.name || tituloMostrar;
                    const uploadedAt = latestPDF.uploaded_at || latestPDF.created_at || latestPDF.fecha;
                    const size = latestPDF.size || latestPDF.bytes;
                    
                    mobileContainer.innerHTML = `
                        <div class="file-info">
                            <h3>${filename}</h3>
                            <p>Actualizado: ${formatDate(uploadedAt)}</p>
                            <p>Tamaño: ${formatFileSize(size)}</p>
                            <a href="${pdfUrl}" class="download-btn" download>
                                Descargar Documento
                            </a>
                        </div>
                    `;
                }
                
                // Configuración específica para iOS
                if (isIOS()) {
                    if (iosContainer) iosContainer.style.display = 'block';
                    if (iosLink) {
                        const filename = latestPDF.filename || latestPDF.original_filename || 
                            (tipoPlantilla === 'plantilla' ? 'plantilla_personal.pdf' : 'plantilla_eventual_personal.pdf');
                        
                        iosLink.href = pdfUrl;
                        iosLink.setAttribute('download', filename);
                    }
                } else {
                    if (iosContainer) iosContainer.style.display = 'none';
                }
                
                console.log('✅ Documento cargado exitosamente');
                
            } else {
                let mensajeError = '';
                if (tipoPlantilla === 'plantilla') {
                    mensajeError = `No se encontraron documentos de plantilla actual para ${ESTADO_FIJO}`;
                } else {
                    mensajeError = `No se encontraron documentos de plantilla eventual para ${ESTADO_FIJO}`;
                }
                console.warn('⚠️ ' + mensajeError);
                showError(mensajeError, 'both');
                
                // Limpiar el visor PDF
                const pdfViewer = document.getElementById('pdf-viewer');
                if (pdfViewer) pdfViewer.src = '';
            }
        } catch (error) {
            console.error('❌ Error al cargar documento:', error);
            showError(`Error al cargar el documento: ${error.message}`, 'both');
            
            // Limpiar el visor PDF en caso de error
            const pdfViewer = document.getElementById('pdf-viewer');
            if (pdfViewer) pdfViewer.src = '';
        } finally {
            showLoading(false);
        }
    }

    // Inicialización
    document.addEventListener('DOMContentLoaded', () => {
        console.log('🚀 Inicializando página de plantillas...');
        
        // Configurar event listeners para los botones de plantilla
        const btnActual = document.getElementById('btn-plantilla-actual');
        const btnEventual = document.getElementById('btn-plantilla-eventual');
        
        if (btnActual) {
            btnActual.addEventListener('click', function() {
                console.log('🔄 Cambiando a Plantilla Actual');
                cargarDocumentoPDF('plantilla');
            });
        }
        
        if (btnEventual) {
            btnEventual.addEventListener('click', function() {
                console.log('🔄 Cambiando a Plantilla Eventual');
                cargarDocumentoPDF('plantilla_ne');
            });
        }

        // Cargar el documento PDF inicial
        if (document.getElementById('pdf-viewer')) {
            console.log('📥 Cargando documento inicial...');
            cargarDocumentoPDF();
        }

        // Manejar clic en el enlace de iOS
        document.getElementById('ios-pdf-link')?.addEventListener('click', function(e) {
            if (isIOS() && documentoUrl) {
                console.log('📱 Abriendo PDF en iOS');
                window.open(documentoUrl, '_blank');
                e.preventDefault();
            }
        });
    });

    // Manejar errores globales
    window.addEventListener('error', (event) => {
        console.error('💥 Error global:', event.error);
        showError('Error inesperado en la aplicación', 'both');
    });
</script>
</body>
</html>
