<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plantilla de Personal</title>
    <link rel="icon" type="image/png" href="../../../imagenes/pasaporte.png">
    <link rel="stylesheet" href="../../estados/diseños/generaldoc.css">
    
    <!-- Scripts de autenticación y menú -->
    <script src="../../auth.js" defer></script>   
    <script src="../../load-menu.js" defer></script>
    <style>
        /* Estilos para el botón de cambio de plantilla */
        .selector-plantilla {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .btn-plantilla {
            padding: 12px 24px;
            background-color: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            min-width: 180px;
        }
        
        .btn-plantilla:hover {
            background-color: #e0e0e0;
            transform: translateY(-2px);
        }
        
        .btn-plantilla.activo {
            background-color: #2c5aa0;
            color: white;
            border-color: #1e3d6f;
        }

        .file-info {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
        }

        .download-btn {
            display: inline-block;
            background: #691932;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body class="mostrar-ubicaciones">
    <!-- HEADER DE DOS LÍNEAS -->
    <div class="header-lineas">
        <div class="linea-superior"></div>
        <div class="linea-inferior"></div>
    </div>

    <!-- El menú se insertará automáticamente aquí por load-menu.js -->
    
    <h1 id="titulo-documento" class="titulo-personalizado">PLANTILLA DE PERSONAL</h1>       
    
    <!-- Selector de tipo de plantilla -->
    <div class="selector-plantilla">
        <button id="btn-plantilla-actual" class="btn-plantilla activo">
            PLANTILLA ACTUAL
        </button>
        <button id="btn-plantilla-eventual" class="btn-plantilla">
            PLANTILLA EVENTUAL
        </button>
    </div>
    
    <div class="loading" id="loading">
        <div class="spinner"></div>
    </div>
    <div class="logo-container">
        <img src="../../imagenes/inm logo.png" alt="Logo INM">
    </div>
    
    <div class="pdf-container">
        <iframe 
            id="pdf-viewer" 
            class="pdf-embed"
            frameborder="0"
            title="Visualizador de PDF"
        ></iframe>
        <div id="pdf-error" class="error-message" style="display: none;"></div>
    </div>

    <!-- Contenedor específico para iOS (oculto en otros dispositivos) -->
    <div id="ios-container" class="ios-only">
        <p>Para visualizar el documento en tu dispositivo iOS:</p>
        <a href="#" id="ios-pdf-link" class="ios-pdf-link" download>
            <span>Descargar Documento</span>
        </a>
        <p class="ios-instructions">Toca el botón arriba para descargar el PDF a tu dispositivo</p>
    </div>

    <div class="mobile-images">
        <div id="mobile-error" class="error-message" style="display: none;"></div>
    </div>

    <!-- Botón de regreso -->
    <button class="regresar-btn" onclick="window.location.href='../datosindex.html'">
        Regresar
    </button>

<script>
    // CONFIGURACIÓN - PLANTILLA DE PERSONAL
    const BACKEND_URL = 'https://control-operativo-1.onrender.com/api';
    const API_KEY = 'Xhy2md57';
    const ESTADO = 'datos-nacionales';
    const TIPO_DOCUMENTO = 'plantilla';
    const TITULO_DOCUMENTO = 'PLANTILLA ESTRUCTURA';

    // Configuración para Plantilla Eventual
    const TIPO_DOCUMENTO_EVENTUAL = 'plantilla_ne';
    const TITULO_EVENTUAL = 'PLANTILLA EVENTUAL';

    // Configuración dinámica desde URL
    const params = new URLSearchParams(window.location.search);
    const estadoFromURL = params.get('estado');
    const tipoFromURL = params.get('tipo');
    const tituloFromURL = params.get('titulo');

    // Valores finales (usa los de URL si existen, sino los definidos arriba)
    const ESTADO_FIJO = estadoFromURL || ESTADO;
    const TIPO_DOC_FIJO = tipoFromURL || TIPO_DOCUMENTO;
    const TITULO_FINAL = tituloFromURL || TITULO_DOCUMENTO;

    // Variables para controlar el estado del documento
    let documentoUrl = '';
    let tipoDocumentoActual = TIPO_DOC_FIJO;

    // Detectar iOS
    function isIOS() {
        return /iPad|iPhone|iPod/.test(navigator.userAgent) || 
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }

    // Mostrar/ocultar loading
    function showLoading(show) {
        const loading = document.getElementById('loading');
        if (loading) {
            loading.style.display = show ? 'flex' : 'none';
        }
    }

    // Mostrar mensaje de error
    function showError(message, target = 'both') {
        console.error('Error:', message);
        
        if (target === 'both' || target === 'pdf') {
            const pdfError = document.getElementById('pdf-error');
            if (pdfError) {
                pdfError.textContent = message;
                pdfError.style.display = 'block';
            }
        }
        if (target === 'both' || target === 'mobile') {
            const mobileError = document.getElementById('mobile-error');
            if (mobileError) {
                mobileError.textContent = message;
                mobileError.style.display = 'block';
            }
        }
    }

    // Ocultar errores
    function hideErrors() {
        const pdfError = document.getElementById('pdf-error');
        const mobileError = document.getElementById('mobile-error');
        
        if (pdfError) pdfError.style.display = 'none';
        if (mobileError) mobileError.style.display = 'none';
    }

    // Actualizar botones activos
    function actualizarBotonesActivos(tipoSeleccionado) {
        // Remover clase activo de todos los botones
        document.querySelectorAll('.btn-plantilla').forEach(btn => {
            btn.classList.remove('activo');
        });
        
        // Agregar clase activo al botón seleccionado
        const btnActual = document.getElementById('btn-plantilla-actual');
        const btnEventual = document.getElementById('btn-plantilla-eventual');
        
        if (tipoSeleccionado === TIPO_DOCUMENTO && btnActual) {
            btnActual.classList.add('activo');
        } else if (tipoSeleccionado === TIPO_DOCUMENTO_EVENTUAL && btnEventual) {
            btnEventual.classList.add('activo');
        }
    }

    // Formatear fecha legible
    function formatDate(dateString) {
        try {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('es-MX', options);
        } catch (error) {
            return 'Fecha no disponible';
        }
    }

    // Cargar PDF desde Cloudinary
    async function cargarDocumentoPDF(tipoDocumento = TIPO_DOC_FIJO) {
        showLoading(true);
        hideErrors();

        // Actualizar tipo de documento actual
        tipoDocumentoActual = tipoDocumento;

        // Actualizar botones activos
        actualizarBotonesActivos(tipoDocumento);

        // Actualizar título de la página según el tipo de plantilla
        let tituloMostrar = TITULO_FINAL;
        if (tipoDocumento === TIPO_DOCUMENTO_EVENTUAL) {
            tituloMostrar = TITULO_EVENTUAL;
        }
        
        document.title = tituloMostrar + ' - ' + ESTADO_FIJO.toUpperCase();
        
        const tituloElemento = document.getElementById('titulo-documento');
        if (tituloElemento) {
            tituloElemento.textContent = tituloMostrar;
        }

        try {
            console.log(`Consultando API para: ${ESTADO_FIJO}/${tipoDocumento}`);
            const response = await fetch(`${BACKEND_URL}/archivos/${ESTADO_FIJO}/${tipoDocumento}`, {
                headers: { 'x-api-key': API_KEY }
            });

            if (!response.ok) throw new Error(`Error ${response.status}: ${response.statusText}`);

            const result = await response.json();
            console.log('Respuesta API:', result);

            if (!result?.data) throw new Error('Formato de respuesta inválido');

            const pdfViewer = document.getElementById('pdf-viewer');
            const mobileContainer = document.querySelector('.mobile-images');
            const iosLink = document.getElementById('ios-pdf-link');

            if (result.data.length > 0) {
                const latestPDF = result.data.sort((a, b) => 
                    new Date(b.uploaded_at) - new Date(a.uploaded_at)
                )[0];

                console.log('Documento encontrado:', latestPDF);

                // Guardar URL para descarga
                documentoUrl = latestPDF.url;

                // Configuración normal para PC
                if (pdfViewer) {
                    pdfViewer.src = latestPDF.url;
                }
                
                // Configuración para móviles (no iOS)
                if (mobileContainer && !isIOS()) {
                    mobileContainer.innerHTML = `
                        <div class="file-info">
                            <h3>${latestPDF.filename || tituloMostrar}</h3>
                            <p>Actualizado: ${formatDate(latestPDF.uploaded_at)}</p>
                            <p>Tamaño: ${(latestPDF.size / (1024*1024)).toFixed(2)} MB</p>
                            <a href="${latestPDF.url}" class="download-btn" download>
                                Descargar Documento
                            </a>
                        </div>
                    `;
                }
                
                // Configuración específica para iOS - Descarga directa
                if (isIOS() && iosLink) {
                    iosLink.href = latestPDF.url;
                    const nombreArchivo = tipoDocumento === TIPO_DOCUMENTO ? 
                        'plantilla_personal.pdf' : 'plantilla_eventual_personal.pdf';
                    iosLink.setAttribute('download', latestPDF.filename || nombreArchivo);
                }
            } else {
                let mensajeError = '';
                if (tipoDocumento === TIPO_DOCUMENTO) {
                    mensajeError = `No se encontraron documentos de plantilla actual para ${ESTADO_FIJO}`;
                } else {
                    mensajeError = `No se encontraron documentos de plantilla eventual para ${ESTADO_FIJO}`;
                }
                showError(mensajeError, 'both');
                
                // Limpiar el visor PDF si no hay documentos
                if (pdfViewer) {
                    pdfViewer.src = '';
                }
            }
        } catch (error) {
            console.error('Error al cargar documento:', error);
            showError(`Error al cargar el documento: ${error.message}`, 'both');
            
            // Limpiar el visor PDF en caso de error
            const pdfViewer = document.getElementById('pdf-viewer');
            if (pdfViewer) {
                pdfViewer.src = '';
            }
        } finally {
            showLoading(false);
        }
    }

    // Inicialización
    document.addEventListener('DOMContentLoaded', () => {
        console.log('Inicializando página de plantillas...');
        
        // Configurar event listeners para los botones
        const btnActual = document.getElementById('btn-plantilla-actual');
        const btnEventual = document.getElementById('btn-plantilla-eventual');
        
        if (btnActual) {
            btnActual.addEventListener('click', function() {
                console.log('Cambiando a Plantilla Actual');
                cargarDocumentoPDF(TIPO_DOCUMENTO);
            });
        }
        
        if (btnEventual) {
            btnEventual.addEventListener('click', function() {
                console.log('Cambiando a Plantilla Eventual');
                cargarDocumentoPDF(TIPO_DOCUMENTO_EVENTUAL);
            });
        }

        // Cargar el documento PDF inicial
        if (document.getElementById('pdf-viewer')) {
            console.log('Cargando documento inicial...');
            cargarDocumentoPDF(TIPO_DOC_FIJO);
        }

        // Manejar clic en el enlace de iOS
        const iosLink = document.getElementById('ios-pdf-link');
        if (iosLink) {
            iosLink.addEventListener('click', function(e) {
                if (isIOS() && documentoUrl) {
                    console.log('Abriendo PDF en iOS');
                    window.open(documentoUrl, '_blank');
                    e.preventDefault();
                }
            });
        }
    });

    // Manejar errores globales
    window.addEventListener('error', (event) => {
        console.error('Error global:', event.error);
        showError('Error inesperado en la aplicación', 'both');
    });
</script>
</body>
</html>
