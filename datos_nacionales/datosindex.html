<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos Nacionales</title>
    <link rel="icon" type="image/png" sizes="48x48" href="../imagenes/mapa.png">
    <link rel="stylesheet" href="estilodatos.css">
    <!-- Cargar Font Awesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Cargar el script del menú dinámico -->
    <script src="../load-menu.js" defer></script>
</head>
<body>
    <!-- HEADER DE DOS LÍNEAS (como en las otras páginas) -->
    <div class="header-lineas">
        <div class="linea-superior"></div>
        <div class="linea-inferior"></div>
    </div>

    <!-- MENÚ LATERAL (se insertará automáticamente por load-menu.js) -->
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <div class="menu-overlay" onclick="toggleMenu()"></div>
    
    <nav class="menu" id="main-menu">
        <img src="../imagenes/inm logo.png" alt="Logo" class="logo-arriba-img">
        <ul>
            <!-- El menú se cargará desde load-menu.js -->
        </ul>
    </nav>

    <!-- Información del instituto -->
    <section class="instituto-info">
        <h1>INSTITUTO NACIONAL DE MIGRACIÓN</h1>
        <h2>Dirección General de Coordinación de Oficinas de Representación</h2>
        <h3>Dirección de Control Operativo</h3>
        <div class="fecha-actual" id="fechaActual"></div>
        <button class="regresar-btn" onclick="window.location.href='../index.html'">
            <i class="fas fa-arrow-left"></i> Regresar
        </button>
    </section>

    <!-- Agregamos el nombre del estado aquí -->
    <div class="estado-info">
        <h4>Datos Nacionales</h4>
    </div>

    <!-- Contenedor solo para las opciones -->
    <div class="contenedor-principal">
        <div class="opciones-container">
            <div class="opciones-grid">
                <div class="fila">
                    <button class="btn-1" onclick="location.href='opcionesdatos/padronvm.html'">
                        <i class="fas fa-car"></i> Padron Vehicular
                    </button>
                    <button class="btn-2" onclick="location.href='opcionesdatos/plantillad.html'">
                        <i class="fas fa-users"></i> Plantilla de Personal
                    </button>
                    <button class="btn-3" onclick="location.href='opcionesdatos/unidadcd.html'">
                        <i class="fas fa-dog"></i> Unidades Caninas
                    </button>
                    <button class="btn-4" onclick="location.href='../construccion.html'">
                        <i class="fas fa-building"></i> Inmuebles
                    </button>
                </div>
                <div class="fila">
                    <button class="btn-5" onclick="location.href='opcionesdatos/personalcom.html'">
                        <i class="fas fa-user-check"></i> Personal Comisionado
                    </button>
                    <button class="btn-6" onclick="location.href='opcionesdatos/estadofuerza.html'">
                        <i class="fas fa-chart-bar"></i> Analítico de Estado de fuerza
                    </button>
                    <button class="btn-7" onclick="location.href='opcionesdatos/rubro.html'">
                        <i class="fas fa-money-bill-wave"></i> Gastos Operativos
                    </button>
                    <button class="btn-8" onclick="location.href='opcionesdatos/tabulador.html'">
                        <i class="fas fa-table"></i> Tabulador
                    </button>
                </div>
                <div class="fila">
                    <button class="btn-9" onclick="location.href='../gestion/archivos.html'">
                        <i class="fas fa-archive"></i> GESTOR DE ARCHIVOS
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Contenedor de logos -->
    <div class="logo-container">
        <img src="../imagenes/inm logo.png" alt="Logo INM">
    </div>

    <script>
        // Función para el menú lateral (compatible con load-menu.js)
        function toggleMenu() {
            const menu = document.getElementById('main-menu');
            const overlay = document.querySelector('.menu-overlay');
            if (menu && overlay) {
                menu.classList.toggle('active');
                overlay.classList.toggle('active');
            }
        }

        // Sistema de autenticación (como en las otras páginas)
        class AuthManager {
            constructor() {
                this.sessionDuration = 60 * 60 * 1000; // 1 hora
                this.checkAuth();
                this.setupNavigationHandlers();
            }

            checkAuth() {
                const isAuthenticated = localStorage.getItem('authenticated') === 'true';
                const loginTime = parseInt(localStorage.getItem('loginTime') || '0');
                const now = Date.now();
                
                console.log('🔐 Verificando autenticación en Datos Nacionales...');

                if (!isAuthenticated || (now - loginTime) > this.sessionDuration) {
                    console.log('❌ Sesión inválida, redirigiendo...');
                    this.redirectToLogin();
                    return false;
                }

                console.log('✅ Sesión válida en Datos Nacionales');
                return true;
            }

            redirectToLogin() {
                localStorage.removeItem('authenticated');
                localStorage.removeItem('loginTime');
                window.location.replace('../login.html');
            }

            setupNavigationHandlers() {
                window.addEventListener('pageshow', (event) => {
                    if (event.persisted) {
                        if (!this.checkAuth()) {
                            this.redirectToLogin();
                        }
                    }
                });
            }
        }

        // Inicializar autenticación
        const authManager = new AuthManager();

        // Mostrar la fecha actual
        document.getElementById("fechaActual").innerHTML = new Date().toLocaleDateString('es-MX', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });

        // Función global para logout
        function logout() {
            if (confirm('¿Estás seguro de que quieres cerrar sesión?')) {
                localStorage.removeItem('authenticated');
                localStorage.removeItem('loginTime');
                window.location.href = '../login.html';
            }
        }

        // Efectos visuales adicionales (como en las otras páginas)
        document.addEventListener('DOMContentLoaded', function() {
            // Animación de entrada para los botones
            const buttons = document.querySelectorAll('.opciones-grid button');
            buttons.forEach((button, index) => {
                setTimeout(() => {
                    button.style.opacity = '1';
                    button.style.transform = 'translateY(0)';
                }, 100 * index);
            });
            
            // Efecto de carga de la página
            setTimeout(() => {
                document.body.classList.add('loaded');
            }, 100);
        });
    </script>
</body>
</html>
